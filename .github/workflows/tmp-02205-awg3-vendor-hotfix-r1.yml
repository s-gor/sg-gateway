name: TEMP 022.05 AWG3 Vendor Hotfix R1

on:
  push:
    branches: [hotfix-02205-awg3-vendor-r1]

permissions:
  contents: write

jobs:
  verify-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hotfix-02205-awg3-vendor-r1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build pinned official AWG3 userspace runtime
        run: |
          rm -rf /tmp/amneziawg-go
          git clone -q https://github.com/amnezia-vpn/amneziawg-go.git /tmp/amneziawg-go
          git -C /tmp/amneziawg-go checkout -q 457d920a1a7d103fc7354e0ca3979e493a681d5e
          test "$(git -C /tmp/amneziawg-go rev-parse HEAD)" = "457d920a1a7d103fc7354e0ca3979e493a681d5e"
          cd /tmp/amneziawg-go
          go mod download
          go mod verify
          CGO_ENABLED=1 go build -trimpath -ldflags '-linkmode external -extldflags "-fno-PIC -static"' -o "$GITHUB_WORKSPACE/vendor/cores/amneziawg-go-linux-amd64-v3.0.0" .
          cd "$GITHUB_WORKSPACE"
          chmod 0755 vendor/cores/amneziawg-go-linux-amd64-v3.0.0
          test -s vendor/cores/amneziawg-go-linux-amd64-v3.0.0
          file vendor/cores/amneziawg-go-linux-amd64-v3.0.0
          sha256sum vendor/cores/amneziawg-go-linux-amd64-v3.0.0

      - name: Wire AWG3 vendor runtime into clean installer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('install.sh')
          text = path.read_text(encoding='utf-8')

          old = 'AMNEZIAWG_DKMS_VERSION="1.0.0"\nPANEL_USER="sg-gateway"'
          new = 'AMNEZIAWG_DKMS_VERSION="1.0.0"\nAWG3_GO_VERSION="v3.0.0"\nPANEL_USER="sg-gateway"'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = 'AWG_KMOD_VENDOR_FILE="amneziawg-linux-kernel-module-3.0.20260805.tar.gz"\n\nDEFAULT_PANEL_PORT='
          new = 'AWG_KMOD_VENDOR_FILE="amneziawg-linux-kernel-module-3.0.20260805.tar.gz"\nAWG3_GO_VENDOR_FILE="amneziawg-go-linux-amd64-v3.0.0"\n\nDEFAULT_PANEL_PORT='
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '    "$AWG_TOOLS_VENDOR_FILE" \\\n    "$AWG_KMOD_VENDOR_FILE"; do'
          new = '    "$AWG_TOOLS_VENDOR_FILE" \\\n    "$AWG_KMOD_VENDOR_FILE" \\\n    "$AWG3_GO_VENDOR_FILE"; do'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '  tar -tzf "$VENDOR_CORES_DIR/$AWG_KMOD_VENDOR_FILE" >/dev/null\n  echo "[SG-Gateway] Vendor core set: OK (6/6, linux/amd64)"'
          new = '  tar -tzf "$VENDOR_CORES_DIR/$AWG_KMOD_VENDOR_FILE" >/dev/null\n  [[ -x "$VENDOR_CORES_DIR/$AWG3_GO_VENDOR_FILE" ]] || { echo "AWG3 userspace vendor binary is not executable" >&2; return 1; }\n  echo "[SG-Gateway] Vendor core set: OK (7/7, linux/amd64)"'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '  awg --version\n\n  echo "AmneziaWG kernel module ${AMNEZIAWG_KMOD_VERSION}: DKMS из локального source"'
          new = '''  awg --version\n\n  # SG_GATEWAY_02205_AWG3_VENDOR_RUNTIME_FIX1\n  # AWG3 is a separate userspace runtime. Clean install must provision its\n  # private tool directory before clients.apply creates/applies AWG3 profiles.\n  install -d -m 0755 "$PREFIX/awg3/bin"\n  install -m 0755 /usr/bin/awg "$PREFIX/awg3/bin/awg"\n  install -m 0755 /usr/bin/awg-quick "$PREFIX/awg3/bin/awg-quick"\n  install -m 0755 "$VENDOR_CORES_DIR/$AWG3_GO_VENDOR_FILE" "$PREFIX/awg3/bin/amneziawg-go"\n  [[ -x "$PREFIX/awg3/bin/awg" ]]\n  [[ -x "$PREFIX/awg3/bin/awg-quick" ]]\n  [[ -x "$PREFIX/awg3/bin/amneziawg-go" ]]\n  echo "AmneziaWG 3 userspace ${AWG3_GO_VERSION}: vendored runtime ready"\n\n  echo "AmneziaWG kernel module ${AMNEZIAWG_KMOD_VERSION}: DKMS из локального source"'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Add AWG3 clean-install regression
        run: |
          cat > tests/test_sg_gateway_02205_awg3_vendor_clean_install.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          INSTALLER = (ROOT / 'install.sh').read_text(encoding='utf-8')

          def test_awg3_official_userspace_binary_is_in_vendor_contract() -> None:
              assert 'AWG3_GO_VERSION="v3.0.0"' in INSTALLER
              assert 'AWG3_GO_VENDOR_FILE="amneziawg-go-linux-amd64-v3.0.0"' in INSTALLER
              assert 'Vendor core set: OK (7/7, linux/amd64)' in INSTALLER
              binary = ROOT / 'vendor/cores/amneziawg-go-linux-amd64-v3.0.0'
              assert binary.is_file()
              assert binary.stat().st_size > 1_000_000

          def test_clean_installer_provisions_awg3_tools_before_clients_apply() -> None:
              marker = 'SG_GATEWAY_02205_AWG3_VENDOR_RUNTIME_FIX1'
              assert marker in INSTALLER
              install_pos = INSTALLER.index(marker)
              apply_pos = INSTALLER.index('stage9_apply_runtime()')
              assert install_pos < apply_pos
              assert 'install -d -m 0755 "$PREFIX/awg3/bin"' in INSTALLER
              assert 'install -m 0755 /usr/bin/awg "$PREFIX/awg3/bin/awg"' in INSTALLER
              assert 'install -m 0755 /usr/bin/awg-quick "$PREFIX/awg3/bin/awg-quick"' in INSTALLER
              assert '"$PREFIX/awg3/bin/amneziawg-go"' in INSTALLER

          def test_awg3_runtime_paths_match_installer_output() -> None:
              runtime = (ROOT / 'hostd/sg_hostd/awg3_runtime.py').read_text(encoding='utf-8')
              helper = (ROOT / 'deploy/sg-gateway-awg3-userspace.sh').read_text(encoding='utf-8')
              for relative in ('bin/awg', 'bin/awg-quick'):
                  assert relative in runtime or relative in helper
              assert '/opt/sg-gateway/awg3' in runtime
              assert '/opt/sg-gateway/awg3' in helper
              assert 'bin/amneziawg-go' in helper
          PY

      - name: Refresh vendor manifest
        run: |
          grep -v '  amneziawg-go-linux-amd64-v3.0.0$' vendor/cores/SHA256SUMS > /tmp/vendor-sha
          sha256sum vendor/cores/amneziawg-go-linux-amd64-v3.0.0 >> /tmp/vendor-sha
          mv /tmp/vendor-sha vendor/cores/SHA256SUMS
          (cd vendor/cores && sha256sum -c SHA256SUMS)

      - name: Remove temporary workflow and stage candidate
        run: |
          git rm .github/workflows/tmp-02205-awg3-vendor-hotfix-r1.yml
          git add install.sh vendor/cores/SHA256SUMS vendor/cores/amneziawg-go-linux-amd64-v3.0.0 tests/test_sg_gateway_02205_awg3_vendor_clean_install.py

      - name: Focused verification
        run: |
          bash -n install.sh
          python -m pytest -q \
            tests/test_sg_gateway_02205_awg3_vendor_clean_install.py \
            tests/test_sg_gateway_02203_awg3_userspace_contract.py \
            tests/test_sg_gateway_02202_dual_awg_contract.py \
            tests/test_sg_gateway_021_vendored_five_engines.py

      - name: Refresh strict source inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          names = sorted(x for x in subprocess.check_output(['git','ls-files'], text=True).splitlines() if x != 'SOURCE-SHA256SUMS')
          with Path('SOURCE-SHA256SUMS').open('w', encoding='utf-8') as out:
              for name in names:
                  out.write(f"{hashlib.sha256(Path(name).read_bytes()).hexdigest()}  {name}\n")
          PY
          git add SOURCE-SHA256SUMS
          sha256sum -c SOURCE-SHA256SUMS >/dev/null

      - name: Full repository suite
        run: python -m pytest -q

      - name: Clean test artifacts and refresh inventory
        run: |
          rm -f data/system-activity.json
          git clean -fdX
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          names = sorted(x for x in subprocess.check_output(['git','ls-files'], text=True).splitlines() if x != 'SOURCE-SHA256SUMS')
          with Path('SOURCE-SHA256SUMS').open('w', encoding='utf-8') as out:
              for name in names:
                  out.write(f"{hashlib.sha256(Path(name).read_bytes()).hexdigest()}  {name}\n")
          PY
          git add SOURCE-SHA256SUMS
          sha256sum -c SOURCE-SHA256SUMS >/dev/null

      - name: Verify minimal scope and pinned provenance
        run: |
          test "$(git -C /tmp/amneziawg-go rev-parse HEAD)" = "457d920a1a7d103fc7354e0ca3979e493a681d5e"
          git diff --cached --check
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only','17d73077a5dc0b4b4a23b671e9c4db8f82fe02a3','--'], text=True).splitlines())
          expected = {
              'install.sh',
              'SOURCE-SHA256SUMS',
              'vendor/cores/SHA256SUMS',
              'vendor/cores/amneziawg-go-linux-amd64-v3.0.0',
              'tests/test_sg_gateway_02205_awg3_vendor_clean_install.py',
          }
          assert changed == expected, (changed, expected)
          PY

      - name: Finalize verified candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix 022.05 clean-install AWG3 vendored runtime'

      - name: Publish verified candidate
        run: git push origin HEAD:hotfix-02205-awg3-vendor-r1
