name: TEMP 022.05 LIVE AWG3 Vendor Hotfix R1

on:
  push:
    branches: [hotfix-02205-live-awg3-vendor-r1]

permissions:
  contents: write

jobs:
  verify-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hotfix-02205-live-awg3-vendor-r1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Bring verified AWG3 vendor binary from dev-02205
        run: |
          git fetch origin dev-02205
          git checkout origin/dev-02205 -- vendor/cores/amneziawg-go-linux-amd64-v3.0.0
          test -s vendor/cores/amneziawg-go-linux-amd64-v3.0.0
          chmod 0755 vendor/cores/amneziawg-go-linux-amd64-v3.0.0
          test "$(sha256sum vendor/cores/amneziawg-go-linux-amd64-v3.0.0 | awk '{print $1}')" = "131110027db6d5dc0e35b19eb5b8a2692676081366c34112088dc68bbb050bcd"
      - name: Patch LIVE installer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('install.sh'); s=p.read_text(encoding='utf-8')
          pairs=[
          ('AMNEZIAWG_DKMS_VERSION="1.0.0"\nPANEL_USER="sg-gateway"','AMNEZIAWG_DKMS_VERSION="1.0.0"\nAWG3_GO_VERSION="v3.0.0"\nPANEL_USER="sg-gateway"'),
          ('AWG_KMOD_VENDOR_FILE="amneziawg-linux-kernel-module-3.0.20260805.tar.gz"\n\nDEFAULT_PANEL_PORT=','AWG_KMOD_VENDOR_FILE="amneziawg-linux-kernel-module-3.0.20260805.tar.gz"\nAWG3_GO_VENDOR_FILE="amneziawg-go-linux-amd64-v3.0.0"\n\nDEFAULT_PANEL_PORT='),
          ('    "$AWG_TOOLS_VENDOR_FILE" \\\n    "$AWG_KMOD_VENDOR_FILE"; do','    "$AWG_TOOLS_VENDOR_FILE" \\\n    "$AWG_KMOD_VENDOR_FILE" \\\n    "$AWG3_GO_VENDOR_FILE"; do'),
          ('  tar -tzf "$VENDOR_CORES_DIR/$AWG_KMOD_VENDOR_FILE" >/dev/null\n  echo "[SG-Gateway] Vendor core set: OK (6/6, linux/amd64)"','  tar -tzf "$VENDOR_CORES_DIR/$AWG_KMOD_VENDOR_FILE" >/dev/null\n  [[ -x "$VENDOR_CORES_DIR/$AWG3_GO_VENDOR_FILE" ]] || { echo "AWG3 userspace vendor binary is not executable" >&2; return 1; }\n  echo "[SG-Gateway] Vendor core set: OK (7/7, linux/amd64)"'),
          ('  awg --version\n\n  echo "AmneziaWG kernel module ${AMNEZIAWG_KMOD_VERSION}: DKMS из локального source"','''  awg --version\n\n  # SG_GATEWAY_02205_AWG3_VENDOR_RUNTIME_FIX1\n  install -d -m 0755 "$PREFIX/awg3/bin"\n  install -m 0755 /usr/bin/awg "$PREFIX/awg3/bin/awg"\n  install -m 0755 /usr/bin/awg-quick "$PREFIX/awg3/bin/awg-quick"\n  install -m 0755 "$VENDOR_CORES_DIR/$AWG3_GO_VENDOR_FILE" "$PREFIX/awg3/bin/amneziawg-go"\n  [[ -x "$PREFIX/awg3/bin/awg" ]]\n  [[ -x "$PREFIX/awg3/bin/awg-quick" ]]\n  [[ -x "$PREFIX/awg3/bin/amneziawg-go" ]]\n  echo "AmneziaWG 3 userspace ${AWG3_GO_VERSION}: vendored runtime ready"\n\n  echo "AmneziaWG kernel module ${AMNEZIAWG_KMOD_VERSION}: DKMS из локального source"''')]
          for old,new in pairs:
              if s.count(old)!=1: raise SystemExit(f'replacement count {s.count(old)}: {old[:60]}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Add regression and vendor hash
        run: |
          cat > tests/test_sg_gateway_02205_awg3_vendor_clean_install.py <<'PY'
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          S=(ROOT/'install.sh').read_text(encoding='utf-8')
          def test_awg3_vendor_is_required_and_installed():
              assert 'AWG3_GO_VERSION="v3.0.0"' in S
              assert 'AWG3_GO_VENDOR_FILE="amneziawg-go-linux-amd64-v3.0.0"' in S
              assert 'Vendor core set: OK (7/7, linux/amd64)' in S
              b=ROOT/'vendor/cores/amneziawg-go-linux-amd64-v3.0.0'
              assert b.is_file() and b.stat().st_size>1_000_000
              assert 'SG_GATEWAY_02205_AWG3_VENDOR_RUNTIME_FIX1' in S
              assert 'install -m 0755 /usr/bin/awg "$PREFIX/awg3/bin/awg"' in S
              assert 'install -m 0755 /usr/bin/awg-quick "$PREFIX/awg3/bin/awg-quick"' in S
              assert '"$PREFIX/awg3/bin/amneziawg-go"' in S
          def test_awg3_runtime_paths_match_installer():
              r=(ROOT/'hostd/sg_hostd/awg3_runtime.py').read_text(encoding='utf-8')
              h=(ROOT/'deploy/sg-gateway-awg3-userspace.sh').read_text(encoding='utf-8')
              assert '/opt/sg-gateway/awg3' in r and '/opt/sg-gateway/awg3' in h
              assert 'bin/amneziawg-go' in h
          PY
          grep -v '  amneziawg-go-linux-amd64-v3.0.0$' vendor/cores/SHA256SUMS > /tmp/vendor-sha
          (cd vendor/cores && sha256sum amneziawg-go-linux-amd64-v3.0.0) >> /tmp/vendor-sha
          mv /tmp/vendor-sha vendor/cores/SHA256SUMS
          (cd vendor/cores && sha256sum -c SHA256SUMS)
      - name: Stage and verify
        run: |
          git rm .github/workflows/tmp-02205-live-awg3-vendor-hotfix-r1.yml
          git add install.sh vendor/cores/SHA256SUMS vendor/cores/amneziawg-go-linux-amd64-v3.0.0 tests/test_sg_gateway_02205_awg3_vendor_clean_install.py
          bash -n install.sh
          python -m pytest -q tests/test_sg_gateway_02205_awg3_vendor_clean_install.py tests/test_sg_gateway_02203_awg3_userspace_contract.py tests/test_sg_gateway_02202_dual_awg_contract.py tests/test_sg_gateway_021_vendored_five_engines.py
      - name: Source inventory and full suite
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          names=sorted(x for x in subprocess.check_output(['git','ls-files'],text=True).splitlines() if x!='SOURCE-SHA256SUMS')
          Path('SOURCE-SHA256SUMS').write_text(''.join(f'{hashlib.sha256(Path(x).read_bytes()).hexdigest()}  {x}\n' for x in names),encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          sha256sum -c SOURCE-SHA256SUMS >/dev/null
          python -m pytest -q
      - name: Finalize source inventory and scope
        run: |
          rm -f data/system-activity.json
          git clean -fdX
          python - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          names=sorted(x for x in subprocess.check_output(['git','ls-files'],text=True).splitlines() if x!='SOURCE-SHA256SUMS')
          Path('SOURCE-SHA256SUMS').write_text(''.join(f'{hashlib.sha256(Path(x).read_bytes()).hexdigest()}  {x}\n' for x in names),encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          sha256sum -c SOURCE-SHA256SUMS >/dev/null
          git diff --cached --check
          python - <<'PY'
          import subprocess
          got=set(subprocess.check_output(['git','diff','--cached','--name-only','9a1c6f5d7d35c7a74b9015ca383637ca3181603b','--'],text=True).splitlines())
          want={'install.sh','SOURCE-SHA256SUMS','vendor/cores/SHA256SUMS','vendor/cores/amneziawg-go-linux-amd64-v3.0.0','tests/test_sg_gateway_02205_awg3_vendor_clean_install.py'}
          assert got==want,(got,want)
          PY
      - name: Commit candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Fix 022.05 LIVE clean-install AWG3 vendored runtime'
      - name: Build and verify LIVE FULL
        run: |
          OUT=/tmp/SG-Gateway-0.1.0-022.05-AWG3-HOTFIX-R1-FULL.run
          bash build-run.sh "$OUT"
          "$OUT" --verify-only
          test -s "${OUT%.run}-TRANSFER.zip"
          unzip -t "${OUT%.run}-TRANSFER.zip"
      - name: Publish candidate
        run: git push origin HEAD:hotfix-02205-live-awg3-vendor-r1
