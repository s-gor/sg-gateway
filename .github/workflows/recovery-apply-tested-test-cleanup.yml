name: Recovery verify squashed 022.05 PR

on:
  push:
    branches: [recovery-02205-vless-xmux-warp-updater]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout squashed PR branch
        uses: actions/checkout@v4
        with:
          ref: dev-02205-sgpanel-xmux-warp-updater-r1
          fetch-depth: 0

      - name: Require exact squashed head
        run: |
          test "$(git rev-parse HEAD)" = "348b425c0919de1429c6e83318f84e0f04b24808"
          test "$(git rev-parse HEAD^{tree})" = "39ba4f911afd8ac4eafe7947456e88421bff5a81"
          test "$(git rev-parse HEAD^)" = "effcafa972e7cd1169d0603943bda68251c4bd65"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run complete repository suite
        run: python -m pytest -q

      - name: Verify strict source inventory
        run: python -m pytest -q tests/test_sg_gateway_02112_final_cumulative_cleanup_r5.py::test_source_checksum_inventory_is_strict_and_complete

      - name: Verify no tracked generated activity artifact
        run: |
          if git ls-files --error-unmatch data/system-activity.json >/dev/null 2>&1; then
            echo 'generated data/system-activity.json must not be tracked' >&2
            exit 1
          fi
