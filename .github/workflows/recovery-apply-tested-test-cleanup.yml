name: Recovery apply verified test cleanup

on:
  push:
    branches: [recovery-02205-vless-xmux-warp-updater]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: dev-02205-sgpanel-xmux-warp-updater-r1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply already-verified historical cleanup
        run: |
          python deploy/recovery_apply_historical_test_cleanup.py
          git rm deploy/recovery_apply_historical_test_cleanup.py

      - name: Regenerate strict checksum after final tracked tree
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          tracked = subprocess.check_output(["git", "ls-files"], text=True, encoding="utf-8").splitlines()
          tracked = sorted(path for path in tracked if path != "SOURCE-SHA256SUMS")
          rows = []
          for rel in tracked:
              path = root / rel
              if not path.is_file():
                  raise SystemExit(f"tracked file missing: {rel}")
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {rel}")
          (root / "SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8", newline="\n")
          print(f"sealed {len(rows)} tracked files")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Require complete repository suite
        run: python -m pytest -q

      - name: Verify checksum inventory independently
        run: python -m pytest -q tests/test_sg_gateway_02112_final_cumulative_cleanup_r5.py::test_source_checksum_inventory_is_strict_and_complete

      - name: Commit tested non-workflow changes
        run: |
          git config user.name "sg-gateway-recovery-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            SOURCE-SHA256SUMS \
            tests/test_sg_gateway_017_warp_panel_port.py \
            tests/test_sg_gateway_020_readable_typography.py \
            tests/test_sg_gateway_020_retest_installer.py \
            tests/test_sg_gateway_02110_cumulative.py \
            tests/test_sg_gateway_02111_backup_domain_release.py \
            tests/test_sg_gateway_02112_final_awg2_freeze.py \
            tests/test_sg_gateway_02112_final_cumulative_cleanup_r5.py \
            tests/test_sg_gateway_0219_subscription_mieru_exports.py \
            tests/test_sg_gateway_021_repository.py \
            tests/test_sg_gateway_021_vendored_five_engines.py
          git diff --cached --check
          if git ls-files --error-unmatch data/system-activity.json >/dev/null 2>&1; then
            echo 'generated data/system-activity.json must not be tracked' >&2
            exit 1
          fi
          git status --short
          git commit -m "Tests: make historical freezes explicit for 022.05 full suite"
          git push origin HEAD:dev-02205-sgpanel-xmux-warp-updater-r1
