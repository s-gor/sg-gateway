name: Agent refresh XMUX UI regression

on:
  push:
    branches:
      - agent/simplify-xmux-ui-20260814

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simplify-xmux-ui-20260814
          fetch-depth: 0

      - name: Refresh stale XMUX UI regression
        run: |
          python3 .github/agent-fix-xmux-ui-regression.py
          git add tests/test_sg_gateway_021_full_publication_ru.py
          git rm -f .github/agent-fix-xmux-ui-regression.py .github/workflows/agent-fix-xmux-ui-regression.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          rows = []
          for relative in tracked:
              if relative == "SOURCE-SHA256SUMS":
                  continue
              path = Path(relative)
              if not path.is_file():
                  continue
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {relative}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          git add SOURCE-SHA256SUMS
          git diff --cached --check

      - name: Commit refreshed regression
        run: |
          git config user.name "SG-Gateway automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Refresh XMUX UI regression"
          git push origin HEAD:agent/simplify-xmux-ui-20260814
