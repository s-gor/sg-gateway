name: TEMP 022.06 Connections UI Cleanup R3

on:
  push:
    branches: [feature-02206-connections-ui-cleanup-r3]

permissions:
  contents: write

jobs:
  verify-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature-02206-connections-ui-cleanup-r3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Unify Connections action button geometry
        run: |
          if ! grep -q 'Connections action sizing R3' app/web/static/sg-controls-final-v1.css; then
            cat >> app/web/static/sg-controls-final-v1.css <<'CSS'

          /* SG-Gateway 022.06 · Connections action sizing R3. */
          .sg-body.page-connections :is(
            .cnv1-heading-actions,
            .xps2-top-actions,
            .xps2-actions,
            .xmux1-actions,
            .cnv1-form-actions,
            .mhv2-actions,
            .mhv2-service-tools,
            .cnv1-note-panel
          ) .button {
            width: 180px !important;
            min-width: 180px !important;
            min-height: 42px !important;
            box-sizing: border-box !important;
            padding: 9px 16px !important;
          }

          .sg-body.page-connections :is(
            .cnv1-heading-actions,
            .xps2-actions > div,
            .mhv2-actions
          ) {
            flex-wrap: wrap !important;
            gap: 10px !important;
          }

          @media (max-width: 680px) {
            .sg-body.page-connections :is(
              .cnv1-heading-actions,
              .xps2-top-actions,
              .xps2-actions,
              .xmux1-actions,
              .cnv1-form-actions,
              .mhv2-actions,
              .mhv2-service-tools,
              .cnv1-note-panel
            ) .button {
              width: 100% !important;
              min-width: 0 !important;
            }
          }
          CSS
          fi

      - name: Remove temporary workflow
        run: git rm .github/workflows/tmp-02206-connections-ui-cleanup-r3.yml

      - name: Verify exact UI-only scope before tests
        run: |
          git diff --name-only 34d2512b9739cf4e7efd8043cf0ed249d1b9dfd7 -- | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = {line.strip() for line in Path('/tmp/changed.txt').read_text().splitlines() if line.strip()}
          allowed = {
              'app/web/static/sg-controls-final-v1.css',
              'app/web/static/sg-xmux-settings-v1.css',
              'app/web/templates/_xray_xmux_settings.html',
              'tests/test_sg_gateway_02206_connections_ui_cleanup_r3.py',
          }
          assert changed == allowed, (changed, allowed)
          PY

      - name: Run focused Connections UI tests
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_02206_connections_ui_cleanup_r3.py \
            tests/test_sg_gateway_02206_connections_layout_r2.py \
            tests/test_sg_gateway_02206_connections_polish.py \
            tests/test_sg_gateway_02205_xmux_sgpanel_contract.py \
            tests/test_sg_gateway_021_xmux_rf.py \
            tests/test_connections_layout_v24.py \
            tests/test_ui_connections_visual_v1.py

      - name: Refresh strict source inventory before full suite
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          raw = subprocess.check_output(['git', 'ls-files', '-co', '--exclude-standard', '-z'])
          names = sorted(item.decode() for item in raw.split(b'\0') if item and item.decode() != 'SOURCE-SHA256SUMS')
          Path('SOURCE-SHA256SUMS').write_text(''.join(f"{hashlib.sha256(Path(name).read_bytes()).hexdigest()}  {name}\n" for name in names), encoding='utf-8')
          PY
          sha256sum -c SOURCE-SHA256SUMS >/dev/null

      - name: Run complete repository suite
        run: python -m pytest -q

      - name: Clean test artifacts and regenerate source inventory
        run: |
          rm -f data/system-activity.json
          git clean -fdX
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          raw = subprocess.check_output(['git', 'ls-files', '-co', '--exclude-standard', '-z'])
          names = sorted(item.decode() for item in raw.split(b'\0') if item and item.decode() != 'SOURCE-SHA256SUMS')
          Path('SOURCE-SHA256SUMS').write_text(''.join(f"{hashlib.sha256(Path(name).read_bytes()).hexdigest()}  {name}\n" for name in names), encoding='utf-8')
          PY
          sha256sum -c SOURCE-SHA256SUMS >/dev/null

      - name: Verify final UI-only diff scope
        run: |
          git diff --name-only 34d2512b9739cf4e7efd8043cf0ed249d1b9dfd7 -- | sort > /tmp/final-changed.txt
          cat /tmp/final-changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = {line.strip() for line in Path('/tmp/final-changed.txt').read_text().splitlines() if line.strip()}
          allowed = {
              'SOURCE-SHA256SUMS',
              'app/web/static/sg-controls-final-v1.css',
              'app/web/static/sg-xmux-settings-v1.css',
              'app/web/templates/_xray_xmux_settings.html',
              'tests/test_sg_gateway_02206_connections_ui_cleanup_r3.py',
          }
          assert changed == allowed, (changed, allowed)
          PY

      - name: Create finalized candidate HEAD
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Clean up Connections XMUX UI and button sizing'
          sha256sum -c SOURCE-SHA256SUMS >/dev/null

      - name: Build and verify FULL package
        run: |
          OUT=/tmp/SG-Gateway-0.1.0-022.06-CONNECTIONS-UI-CLEANUP-R3.run
          bash build-run.sh "$OUT"
          "$OUT" --verify-only
          test -s /tmp/SG-Gateway-0.1.0-022.06-CONNECTIONS-UI-CLEANUP-R3-SHA256.txt
          test -s /tmp/SG-Gateway-0.1.0-022.06-CONNECTIONS-UI-CLEANUP-R3-TRANSFER.zip
          unzip -t /tmp/SG-Gateway-0.1.0-022.06-CONNECTIONS-UI-CLEANUP-R3-TRANSFER.zip

      - name: Publish verified final candidate
        run: git push origin HEAD:feature-02206-connections-ui-cleanup-r3
