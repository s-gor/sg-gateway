name: Initialize 022.06 development

on:
  push:
    branches:
      - init-02206-development-r1

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  initialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply 022.06 initialization
        run: python .github/scripts/init-02206-development-r1.py

      - name: Check shell and Python syntax
        run: |
          bash -n install.sh
          bash -n build-run.sh
          bash -n build-run-vendored.sh
          bash -n deploy/install-from-github.sh
          bash -n deploy/update-from-github.sh
          python -B -c "from pathlib import Path; files=list(Path('app').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('engines').rglob('*.py'))+list(Path('deploy').rglob('*.py'))+list(Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print(f'syntax ok: {len(files)} files')"

      - name: Remove verification scaffolding and stage candidate
        run: |
          git rm .github/workflows/init-02206-development-r1.yml
          git rm .github/scripts/init-02206-development-r1.py
          rm -f data/system-activity.json
          git add -A

      - name: Rebuild strict source checksum inventory
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          paths = sorted(
              p.decode('utf-8') for p in tracked
              if p and p.decode('utf-8') != 'SOURCE-SHA256SUMS'
          )
          lines = []
          for raw in paths:
              path = Path(raw)
              if not path.is_file():
                  continue
              lines.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {raw}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          print(f'SOURCE-SHA256SUMS entries={len(lines)}')
          PY
          git add SOURCE-SHA256SUMS

      - name: Commit exact candidate tree
        run: |
          git config user.name 'sg-gateway-02206-init-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Initialize SG-Gateway 0.1.0-022.06 development'
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Focused 022.06 identity and channel regressions
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_02206_development_identity.py \
            tests/test_sg_gateway_02206_update_channel_defaults.py \
            tests/test_sg_gateway_02205_panel_update_safety.py \
            tests/test_sg_gateway_02205_panel_update_state_binding.py \
            tests/test_sg_gateway_021_maintenance_updates_v1.py \
            tests/test_version.py

      - name: Preserve inherited 022.05 runtime contracts
        run: |
          python -m pytest -q tests/test_sg_gateway_02205_xmux_sgpanel_contract.py
          python -m pytest -q tests/test_sg_gateway_02205_optional_warp_install.py
          python -m pytest -q tests/test_sg_gateway_02205_update_wsgi_isolation.py
          python -m pytest -q tests/test_sg_subscription_v1_*_02205.py
          python -m pytest -q tests/test_sg_gateway_02205_full_backup_verify.py tests/test_sg_gateway_02205_full_backup_verify_ui.py tests/test_sg_gateway_02205_full_backup_verify_mux.py

      - name: Full repository suite
        run: python -m pytest -q

      - name: Build and verify 022.06 development FULL package
        run: |
          command -v zip
          command -v unzip
          OUT=/tmp/SG-Gateway-0.1.0-022.06-FULL.run
          bash build-run.sh "$OUT"
          "$OUT" --verify-only
          test -s /tmp/SG-Gateway-0.1.0-022.06-FULL-SHA256.txt
          test -s /tmp/SG-Gateway-0.1.0-022.06-FULL-TRANSFER.zip
          unzip -t /tmp/SG-Gateway-0.1.0-022.06-FULL-TRANSFER.zip
          (cd /tmp && sha256sum -c SG-Gateway-0.1.0-022.06-FULL-SHA256.txt)

      - name: Verify initialization diff scope
        run: |
          rm -f data/system-activity.json
          git status --short
          python - <<'PY'
          import subprocess

          base = 'a0c2537b6c55d1fd974afe3aab586a7d41777cd8'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', f'{base}..HEAD']).decode().splitlines())
          allowed = {
              '.github/workflows/ci-02206-dev.yml',
              'BUILD-ID',
              'CHANGELOG.md',
              'SOURCE-SHA256SUMS',
              'VERSION',
              'app/maintenance/panel_updates.py',
              'app/production.py',
              'deploy/install-from-github.sh',
              'deploy/update-from-github.sh',
              'install.sh',
              'release-manifest.json',
              'tests/test_sg_gateway_021_maintenance_updates_v1.py',
              'tests/test_sg_gateway_02205_installer_identity.py',
              'tests/test_sg_gateway_02205_panel_update_safety.py',
              'tests/test_sg_gateway_02205_publication.py',
              'tests/test_sg_gateway_02205_update_channel_defaults.py',
              'tests/test_sg_gateway_02206_development_identity.py',
              'tests/test_sg_gateway_02206_update_channel_defaults.py',
          }
          unexpected = changed - allowed
          missing = {
              '.github/workflows/ci-02206-dev.yml', 'BUILD-ID', 'VERSION', 'install.sh',
              'release-manifest.json', 'app/maintenance/panel_updates.py',
              'deploy/install-from-github.sh', 'deploy/update-from-github.sh',
              'tests/test_sg_gateway_02206_development_identity.py',
              'tests/test_sg_gateway_02206_update_channel_defaults.py', 'SOURCE-SHA256SUMS'
          } - changed
          assert not unexpected, sorted(unexpected)
          assert not missing, sorted(missing)
          forbidden_prefixes = ('app/xray/', 'app/routing/', 'hostd/sg_hostd/xray', 'vendor/cores/')
          assert not [p for p in changed if p.startswith(forbidden_prefixes)]
          print('022.06 initialization diff scope: OK')
          PY

      - name: Upload verified development package
        uses: actions/upload-artifact@v4
        with:
          name: SG-Gateway-0.1.0-022.06-DEV-BASE
          path: |
            /tmp/SG-Gateway-0.1.0-022.06-FULL.run
            /tmp/SG-Gateway-0.1.0-022.06-FULL-SHA256.txt
            /tmp/SG-Gateway-0.1.0-022.06-FULL-TRANSFER.zip
          if-no-files-found: error

      - name: Push non-workflow transport tree
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          printf 'VERIFIED_CANDIDATE_SHA=%s\n' "$candidate_sha"
          printf 'VERIFIED_CANDIDATE_TREE=%s\n' "$candidate_tree"

          git reset --soft "$GITHUB_SHA"
          rm -f .github/workflows/ci-02206-dev.yml
          git restore --source="$GITHUB_SHA" --staged --worktree \
            .github/workflows/init-02206-development-r1.yml \
            .github/scripts/init-02206-development-r1.py
          rm -f data/system-activity.json
          git add -A
          git commit -m 'Stage verified 022.06 development payload'

          if git diff --name-only "$GITHUB_SHA..HEAD" | grep -q '^\.github/workflows/'; then
            echo 'transport commit unexpectedly changes workflow files' >&2
            exit 1
          fi
          git push --force origin HEAD:publish-02206-init-transport-r1
