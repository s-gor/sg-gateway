name: SG-Gateway 021.7 merge verified 22 fixes into main source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sg-gateway-0217-merge-22.yml"
      - "tools/sg-gateway-0217-checkpoint1-22-fix-replay.run"

permissions:
  contents: write

concurrency:
  group: sg-gateway-0217-merge-22
  cancel-in-progress: false

jobs:
  merge-verified-22:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact replay package
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "788bc3d3e534cfc14bc17117cddf1088cbc09a670e3e52f283f6094839eaa79f  tools/sg-gateway-0217-checkpoint1-22-fix-replay.run" | sha256sum -c -
          bash -n "tools/sg-gateway-0217-checkpoint1-22-fix-replay.run"
          "tools/sg-gateway-0217-checkpoint1-22-fix-replay.run" --verify-only

      - name: Freeze protected Connections runtime hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          protected=(
            app/web/templates/connections.html
            app/web/templates/_mihomo_panel.html
            app/mihomo/service.py
            app/mihomo/helper.py
            app/clients/exports.py
            hostd/sg_hostd/client_runtime.py
            hostd/sg_hostd/commands.py
            hostd/sg_hostd/operation_jobs.py
            hostd/sg_hostd/operation_job_runner.py
          )
          : > "$RUNNER_TEMP/protected-before.sha256"
          for f in "${protected[@]}"; do
            test -f "$f"
            sha256sum "$f" >> "$RUNNER_TEMP/protected-before.sha256"
          done

      - name: Apply exact 22 fixes to real source tree
        shell: bash
        env:
          SG_GATEWAY_APP_ROOT: ${{ github.workspace }}
          SG_GATEWAY_TEST_MODE: "1"
          SG_GATEWAY_SERVICE: "sg-gateway-source-merge"
          SG_GATEWAY_BACKUP_ROOT: ${{ runner.temp }}/sg-gateway-hotfix-backups
        run: |
          set -Eeuo pipefail
          chmod +x "tools/sg-gateway-0217-checkpoint1-22-fix-replay.run"
          "tools/sg-gateway-0217-checkpoint1-22-fix-replay.run" --all

      - name: Verify protected Connections runtime unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          protected=(
            app/web/templates/connections.html
            app/web/templates/_mihomo_panel.html
            app/mihomo/service.py
            app/mihomo/helper.py
            app/clients/exports.py
            hostd/sg_hostd/client_runtime.py
            hostd/sg_hostd/commands.py
            hostd/sg_hostd/operation_jobs.py
            hostd/sg_hostd/operation_job_runner.py
          )
          : > "$RUNNER_TEMP/protected-after.sha256"
          for f in "${protected[@]}"; do
            sha256sum "$f" >> "$RUNNER_TEMP/protected-after.sha256"
          done
          diff -u "$RUNNER_TEMP/protected-before.sha256" "$RUNNER_TEMP/protected-after.sha256"

      - name: Verify accepted 22-fix source state
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -Fq 'data-sg-memory-card="1"' app/web/templates/system.html
          grep -Fq 'data-sg-disk-card="1"' app/web/templates/system.html
          grep -Fq 'data-sg-cpu-card="1"' app/web/templates/system.html
          grep -Fq 'sg-system-resource-labels-v2.js' app/web/templates/system.html
          grep -Fq 'Трафик и активность' app/web/templates/system.html

          for marker in             sg-system-unified-free-color-v2.css             sg-system-cpu-summary-header-v1.css             sg-system-memory-row-bars-v1.css             sg-system-dial-sg-gateway-sector-v1.css             sg-system-dial-math-sync-v1.js             sg-system-top-dividers-remove-v2.css             sg-system-memory-legend-divider-remove-v1.css             sg-system-light-theme-v3.css
          do
            grep -Fq "$marker" app/web/templates/base.html
          done

          grep -Fq 'sg-security-password-fix1.css' app/web/templates/security.html

          python3 -m py_compile             app/main.py             app/security/auth.py             app/system_activity.py             app/cpu_activity.py

          git diff --check

      - name: Stage only accepted source changes
        shell: bash
        run: |
          set -Eeuo pipefail

          # Temporary trigger files must not remain in final main.
          rm -f ".github/workflows/sg-gateway-0217-merge-22.yml"
          rm -f "tools/sg-gateway-0217-checkpoint1-22-fix-replay.run"

          git add -- app
          git add -u -- ".github/workflows/sg-gateway-0217-merge-22.yml" "tools/sg-gateway-0217-checkpoint1-22-fix-replay.run"

          bad=0
          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              app/main.py|              app/security/auth.py|              app/system_activity.py|              app/cpu_activity.py|              app/web/templates/base.html|              app/web/templates/security.html|              app/web/templates/system.html|              app/web/static/sg-*.css|              app/web/static/sg-*.js|              .github/workflows/sg-gateway-0217-merge-22.yml|              tools/sg-gateway-0217-checkpoint1-22-fix-replay.run)
                ;;
              *)
                echo "UNEXPECTED CHANGED PATH: $path" >&2
                bad=1
                ;;
            esac
          done < <(git diff --cached --name-only)

          test "$bad" -eq 0
          git diff --cached --check

          echo "===== FINAL STAGED FILES ====="
          git diff --cached --name-status

      - name: Commit merged source to main
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 1
          fi

          git commit -m "SG-Gateway 0.1.0-021.7 merge verified 22 fixes into main source"
          git push origin HEAD:main
