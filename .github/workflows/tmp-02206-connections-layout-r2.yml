name: TEMP 022.06 Connections Layout R2

on:
  push:
    branches: [feature-02206-connections-layout-r2]

permissions:
  contents: write

jobs:
  verify-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature-02206-connections-layout-r2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply CSS-only Connections layout R2
        run: |
          cat >> app/web/static/sg-preview28-final.css <<'CSS'

          /* SG-Gateway 022.06 · Connections layout R2 — CSS only. */
          @media (min-width: 1281px) {
            .xps2-parameter-row:not(.has-xhttp) {
              grid-template-columns: minmax(260px, 1fr) 170px minmax(250px, .80fr) minmax(220px, .70fr);
              align-items: center;
            }

            .xps2-parameter-row:not(.has-xhttp) > .xps2-parameter-note {
              grid-column: 4;
              justify-self: end;
              text-align: right;
            }

            .xps2-parameter-row.has-xhttp {
              grid-template-columns: minmax(240px, 1fr) 160px minmax(225px, .78fr) minmax(205px, .68fr) minmax(250px, .90fr);
              align-items: center;
            }

            .xps2-parameter-row.has-xhttp > :is(.xps2-port-field, .xps2-flow-field, .xps2-encryption-field, .xps2-path-field) {
              align-self: center;
            }
          }

          .xps2-parameter-row :is(.xps2-port-field, .xps2-path-field) {
            align-self: center;
          }

          .xps2-parameter-row :is(.xps2-port-field, .xps2-path-field) input {
            min-height: 46px;
          }

          .xps2-parameter-row .xps2-flow-field,
          .xps2-parameter-row .xps2-encryption-field {
            min-width: 0;
            align-self: center;
          }

          /* AWG keeps its natural content height instead of stretching to Mihomo. */
          .cnv1-engine-pair {
            align-items: start;
          }

          .cnv1-engine-pair > .cnv1-engine-card,
          .cnv1-engine-pair > .mhv2-panel {
            align-self: start;
          }

          .cnv1-engine-awg .cnv1-engine-form-compact {
            flex: 0 0 auto;
          }

          .cnv1-engine-awg .cnv1-form-actions {
            margin-top: 14px;
          }

          /* Listener headers may wrap; status controls never push text out of the card. */
          .cnv1-engine-mihomo .mhv2-listener > header {
            flex-wrap: wrap;
            gap: 8px 10px;
          }

          .cnv1-engine-mihomo .mhv2-listener-title {
            min-width: 0;
          }

          .cnv1-engine-mihomo .mhv2-listener-title p {
            white-space: normal;
            overflow-wrap: anywhere;
          }

          .cnv1-engine-mihomo .mhv2-switch {
            margin-left: auto;
          }

          /* In the half-width engine card, Mieru gets a full row; AnyTLS and TUIC share the next row. */
          @media (min-width: 1280px) {
            .cnv1-engine-mihomo .mhv2-listeners-compact {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .cnv1-engine-mihomo .mhv2-listener:first-child {
              grid-column: 1 / -1;
            }

            .cnv1-engine-mihomo .mhv2-listener:first-child .mhv2-basic-fields {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .cnv1-engine-mihomo .mhv2-listener:not(:first-child) .mhv2-basic-fields {
              grid-template-columns: 1fr;
            }
          }
          CSS

          cat > tests/test_sg_gateway_02206_connections_layout_r2.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          CSS = (ROOT / 'app/web/static/sg-preview28-final.css').read_text(encoding='utf-8')


          def test_connections_layout_r2_compacts_xray_parameter_rows():
              assert 'Connections layout R2 — CSS only' in CSS
              assert '.xps2-parameter-row:not(.has-xhttp)' in CSS
              assert 'grid-column: 4' in CSS
              assert '.xps2-parameter-row.has-xhttp' in CSS
              assert 'align-items: center' in CSS
              assert 'min-height: 46px' in CSS


          def test_connections_layout_r2_stops_awg_stretching():
              assert '.cnv1-engine-pair' in CSS
              assert 'align-items: start' in CSS
              assert '.cnv1-engine-awg .cnv1-engine-form-compact' in CSS
              assert 'flex: 0 0 auto' in CSS


          def test_connections_layout_r2_gives_mihomo_readable_listener_grid():
              assert '.cnv1-engine-mihomo .mhv2-listeners-compact' in CSS
              assert 'grid-template-columns: repeat(2, minmax(0, 1fr))' in CSS
              assert '.cnv1-engine-mihomo .mhv2-listener:first-child' in CSS
              assert 'grid-column: 1 / -1' in CSS
              assert 'overflow-wrap: anywhere' in CSS
          PY

      - name: Remove temporary workflow
        run: git rm .github/workflows/tmp-02206-connections-layout-r2.yml

      - name: Verify exact UI-only scope before tests
        run: |
          git add -N tests/test_sg_gateway_02206_connections_layout_r2.py
          git diff --name-only 555568ae8c4cfa58a1b20502a01ef04d20486f8d -- | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = {x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()}
          allowed = {
              'app/web/static/sg-preview28-final.css',
              'tests/test_sg_gateway_02206_connections_layout_r2.py',
          }
          assert changed == allowed, (changed, allowed)
          PY

      - name: Run focused Connections UI tests
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_02206_connections_layout_r2.py \
            tests/test_sg_gateway_02206_connections_polish.py \
            tests/test_connections_layout_v24.py \
            tests/test_preview28_balanced_engine_cards.py

      - name: Refresh strict source inventory before full suite
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          raw = subprocess.check_output(['git', 'ls-files', '-co', '--exclude-standard', '-z'])
          files = sorted(x.decode() for x in raw.split(b'\0') if x and x.decode() != 'SOURCE-SHA256SUMS')
          lines = []
          for name in files:
              data = Path(name).read_bytes()
              lines.append(f"{hashlib.sha256(data).hexdigest()}  {name}\n")
          Path('SOURCE-SHA256SUMS').write_text(''.join(lines), encoding='utf-8')
          PY
          sha256sum -c SOURCE-SHA256SUMS >/dev/null

      - name: Run complete repository suite
        run: python -m pytest -q

      - name: Clean test artifacts and regenerate strict source inventory
        run: |
          rm -f data/system-activity.json
          git clean -fdX
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          raw = subprocess.check_output(['git', 'ls-files', '-co', '--exclude-standard', '-z'])
          files = sorted(x.decode() for x in raw.split(b'\0') if x and x.decode() != 'SOURCE-SHA256SUMS')
          lines = []
          for name in files:
              data = Path(name).read_bytes()
              lines.append(f"{hashlib.sha256(data).hexdigest()}  {name}\n")
          Path('SOURCE-SHA256SUMS').write_text(''.join(lines), encoding='utf-8')
          PY
          sha256sum -c SOURCE-SHA256SUMS >/dev/null

      - name: Verify final UI-only diff scope
        run: |
          git add -N tests/test_sg_gateway_02206_connections_layout_r2.py
          git diff --name-only 555568ae8c4cfa58a1b20502a01ef04d20486f8d -- | sort > /tmp/final-changed.txt
          cat /tmp/final-changed.txt
          python - <<'PY'
          from pathlib import Path
          changed = {x.strip() for x in Path('/tmp/final-changed.txt').read_text().splitlines() if x.strip()}
          allowed = {
              'SOURCE-SHA256SUMS',
              'app/web/static/sg-preview28-final.css',
              'tests/test_sg_gateway_02206_connections_layout_r2.py',
          }
          assert changed == allowed, (changed, allowed)
          PY

      - name: Create finalized candidate HEAD
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Polish Connections layout R2'
          test ! -e .github/workflows/tmp-02206-connections-layout-r2.yml
          sha256sum -c SOURCE-SHA256SUMS >/dev/null

      - name: Build and verify FULL package from finalized HEAD
        run: |
          OUT=/tmp/SG-Gateway-0.1.0-022.06-CONNECTIONS-LAYOUT-R2.run
          bash build-run.sh "$OUT"
          "$OUT" --verify-only
          test -s /tmp/SG-Gateway-0.1.0-022.06-CONNECTIONS-LAYOUT-R2-SHA256.txt
          test -s /tmp/SG-Gateway-0.1.0-022.06-CONNECTIONS-LAYOUT-R2-TRANSFER.zip
          unzip -t /tmp/SG-Gateway-0.1.0-022.06-CONNECTIONS-LAYOUT-R2-TRANSFER.zip

      - name: Publish verified final candidate
        run: git push origin HEAD:feature-02206-connections-layout-r2
