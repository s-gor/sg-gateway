name: Agent VLESS and WARP patch

on:
  push:
    branches:
      - agent/vless-xmux-auto-manual-warp-optional-20260814
    paths:
      - .github/workflows/agent-vless-warp-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vless-xmux-auto-manual-warp-optional-20260814
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 tools/agent_vless_warp_patch.py
      - name: Commit final patch
        run: |
          git config user.name "SG-Gateway automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make VLESS XMUX user-controlled and WARP optional"
          git push origin HEAD:agent/vless-xmux-auto-manual-warp-optional-20260814
