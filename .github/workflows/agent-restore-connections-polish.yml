name: Agent restore Connections polish

on:
  push:
    branches:
      - agent/restore-connections-polish-20260814

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-connections-polish-20260814
          fetch-depth: 0

      - name: Restore approved Connections geometry
        run: |
          python3 .github/agent-restore-connections-polish.py
          git add -A
          git diff --cached --check

      - name: Commit restored Connections UI
        run: |
          git config user.name "SG-Gateway automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Restore polished Connections layout"
          git push origin HEAD:agent/restore-connections-polish-20260814
