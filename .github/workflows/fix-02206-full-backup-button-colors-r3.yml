name: Verify 022.06 Full Backup button colors R3

on:
  push:
    branches:
      - fix-02206-full-backup-button-colors-r3

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  full-backup-colors-r3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate patch generator syntax
        run: python -m py_compile .github/scripts/fix-02206-full-backup-button-colors-r3.py

      - name: Apply dual-theme Full Backup color fix
        run: python .github/scripts/fix-02206-full-backup-button-colors-r3.py

      - name: Remove verification scaffolding and stage candidate
        run: |
          git rm .github/workflows/fix-02206-full-backup-button-colors-r3.yml
          git rm .github/scripts/fix-02206-full-backup-button-colors-r3.py
          rm -f data/system-activity.json
          git add -A

      - name: Rebuild strict source checksum inventory
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          paths = sorted(
              p.decode('utf-8') for p in tracked
              if p and p.decode('utf-8') != 'SOURCE-SHA256SUMS'
          )
          lines = []
          for raw in paths:
              path = Path(raw)
              if not path.is_file():
                  continue
              lines.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {raw}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          print(f'SOURCE-SHA256SUMS entries={len(lines)}')
          PY
          git add SOURCE-SHA256SUMS

      - name: Commit exact candidate tree
        run: |
          git config user.name 'sg-gateway-02206-full-backup-colors-r3-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Make Full Backup action colors distinct in both themes'
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Focused Full Backup regressions
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_02206_full_backup_button_colors_r3.py \
            tests/test_sg_gateway_02205_full_backup_verify_ui.py \
            tests/test_sg_gateway_02206_full_backup_verify_unlimited.py \
            tests/test_sg_gateway_02205_full_backup_verify.py \
            tests/test_sg_gateway_02205_full_backup_verify_mux.py

      - name: Full repository suite
        run: python -m pytest -q

      - name: Build and verify 022.06 FULL package
        run: |
          command -v zip
          command -v unzip
          OUT=/tmp/SG-Gateway-0.1.0-022.06-FULL.run
          bash build-run.sh "$OUT"
          "$OUT" --verify-only
          test -s /tmp/SG-Gateway-0.1.0-022.06-FULL-SHA256.txt
          test -s /tmp/SG-Gateway-0.1.0-022.06-FULL-TRANSFER.zip
          unzip -t /tmp/SG-Gateway-0.1.0-022.06-FULL-TRANSFER.zip
          (cd /tmp && sha256sum -c SG-Gateway-0.1.0-022.06-FULL-SHA256.txt)

      - name: Verify exact UI-only diff scope
        run: |
          rm -f data/system-activity.json
          git status --short
          python - <<'PY'
          import subprocess

          base = '161db4a15f16de14304ee97ba70a42bb9ac5a969'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', f'{base}..HEAD']).decode().splitlines())
          allowed = {
              'SOURCE-SHA256SUMS',
              'app/web/static/sg-full-backup-button-colors-r2.css',
              'app/web/static/sg-full-backup-button-colors-r3.css',
              'app/web/templates/base.html',
              'tests/test_sg_gateway_02206_full_backup_button_colors_r2.py',
              'tests/test_sg_gateway_02206_full_backup_button_colors_r3.py',
          }
          assert changed == allowed, sorted(changed)
          print('Full Backup button color R3 diff scope: UI-only OK')
          PY

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: SG-Gateway-0.1.0-022.06-FULL-BACKUP-COLORS-R3
          path: |
            /tmp/SG-Gateway-0.1.0-022.06-FULL.run
            /tmp/SG-Gateway-0.1.0-022.06-FULL-SHA256.txt
            /tmp/SG-Gateway-0.1.0-022.06-FULL-TRANSFER.zip
          if-no-files-found: error

      - name: Push non-workflow transport tree
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          printf 'VERIFIED_CANDIDATE_SHA=%s\n' "$candidate_sha"
          printf 'VERIFIED_CANDIDATE_TREE=%s\n' "$candidate_tree"

          git reset --soft "$GITHUB_SHA"
          git restore --source="$GITHUB_SHA" --staged --worktree \
            .github/workflows/fix-02206-full-backup-button-colors-r3.yml
          rm -f data/system-activity.json
          git add -A
          git commit -m 'Stage verified Full Backup colors R3 payload'

          if git diff --name-only "$GITHUB_SHA..HEAD" | grep -q '^\.github/workflows/'; then
            echo 'transport commit unexpectedly changes workflow files' >&2
            exit 1
          fi
          git push --force origin HEAD:publish-02206-full-backup-button-colors-r3-transport-r1
