name: Refresh pre-VLESS compatibility integrity

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Add pre-VLESS compatibility integrity helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove helper and refresh SOURCE-SHA256SUMS
        run: |
          git rm .github/workflows/agent-refresh-pre-vless-compat.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          rows = []
          for relative in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              if relative == 'SOURCE-SHA256SUMS':
                  continue
              path = Path(relative)
              if path.is_file():
                  rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {relative}")
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          git diff --cached --check

      - name: Commit compatibility integrity
        run: |
          git config user.name "SG-Gateway automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Refresh pre-VLESS compatibility integrity"
          git push origin HEAD:main
