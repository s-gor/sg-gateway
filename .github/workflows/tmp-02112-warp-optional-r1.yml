name: TEMP 021.12 WARP Optional R1

on:
  push:
    branches: [hotfix-02112-warp-optional-r1]

permissions:
  contents: write

jobs:
  verify-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hotfix-02112-warp-optional-r1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Disable automatic WARP install in 021.12
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('install.sh')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '  run_hidden "Этап 9/9 · 3/6 · Сохранение/применение Xray runtime" stage9_apply_runtime\n': '  run_hidden "Этап 9/9 · 3/5 · Сохранение/применение Xray runtime" stage9_apply_runtime\n',
              '  run_hidden "Этап 9/9 · 5/6 · Запуск панели" stage9_start_panel\n': '  run_hidden "Этап 9/9 · 4/5 · Запуск панели" stage9_start_panel\n',
              '  run_hidden "Этап 9/9 · 6/6 · Проверка Nginx и служб" stage9_verify_nginx\n': '  run_hidden "Этап 9/9 · 5/5 · Проверка Nginx и служб" stage9_verify_nginx\n',
          }
          warp = '  run_hidden "Этап 9/9 · 4/6 · Создание и активация WARP" stage9_ensure_warp\n'
          if warp not in text:
              raise SystemExit('021.12 automatic WARP stage not found')
          text = text.replace(warp, '', 1)
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected stage line not found: {old.strip()}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add regression test
        run: |
          cat > tests/test_sg_gateway_02112_warp_optional_hotfix.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]

          def test_02112_clean_install_does_not_auto_install_warp() -> None:
              text = (ROOT / 'install.sh').read_text(encoding='utf-8')
              start = text.index('run_final_stage()')
              end = text.index('verify_client_identities_after_update()', start)
              block = text[start:end]
              assert 'stage9_ensure_warp' not in block
              assert 'Создание и активация WARP' not in block
              assert '3/5 · Сохранение/применение Xray runtime' in block
              assert '4/5 · Запуск панели' in block
              assert '5/5 · Проверка Nginx и служб' in block

          def test_02112_keeps_manual_warp_hostd_capability() -> None:
              text = (ROOT / 'install.sh').read_text(encoding='utf-8')
              assert '"warp.install"' in text
              assert 'stage9_ensure_warp()' in text
          PY

      - name: Remove temporary workflow and stage candidate files
        run: |
          git rm .github/workflows/tmp-02112-warp-optional-r1.yml
          git add install.sh tests/test_sg_gateway_02112_warp_optional_hotfix.py

      - name: Syntax and focused tests
        run: |
          bash -n install.sh
          python -m pytest -q tests/test_sg_gateway_02112_warp_optional_hotfix.py

      - name: Refresh source inventory if present
        run: |
          if [[ -f SOURCE-SHA256SUMS ]]; then
            python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          raw = subprocess.check_output(['git','ls-files','-z'])
          names = sorted(x.decode() for x in raw.split(b'\0') if x and x.decode() != 'SOURCE-SHA256SUMS')
          Path('SOURCE-SHA256SUMS').write_text(''.join(f"{hashlib.sha256(Path(n).read_bytes()).hexdigest()}  {n}\n" for n in names), encoding='utf-8')
          PY
            sha256sum -c SOURCE-SHA256SUMS >/dev/null
          fi

      - name: Full test suite
        run: python -m pytest -q

      - name: Clean artifacts and refresh inventory
        run: |
          rm -f data/system-activity.json
          git clean -fdX
          if [[ -f SOURCE-SHA256SUMS ]]; then
            python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          raw = subprocess.check_output(['git','ls-files','-z'])
          names = sorted(x.decode() for x in raw.split(b'\0') if x and x.decode() != 'SOURCE-SHA256SUMS')
          Path('SOURCE-SHA256SUMS').write_text(''.join(f"{hashlib.sha256(Path(n).read_bytes()).hexdigest()}  {n}\n" for n in names), encoding='utf-8')
          PY
            sha256sum -c SOURCE-SHA256SUMS >/dev/null
          fi

      - name: Verify minimal scope
        run: |
          git diff 5a7cc066e402026aeb33b144675045a7011c7e27 --name-only -- | sort
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','5a7cc066e402026aeb33b144675045a7011c7e27','--name-only','--']).decode().splitlines())
          allowed = {'install.sh','tests/test_sg_gateway_02112_warp_optional_hotfix.py'}
          if 'SOURCE-SHA256SUMS' in changed:
              allowed.add('SOURCE-SHA256SUMS')
          assert changed == allowed, (changed, allowed)
          PY

      - name: Finalize candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Make WARP optional on SG-Gateway 021.12 clean install'

      - name: Build and verify FULL
        run: |
          OUT=/tmp/SG-Gateway-0.1.0-021.12-WARP-OPTIONAL-R1.run
          bash build-run.sh "$OUT"
          "$OUT" --verify-only

      - name: Publish verified candidate
        run: git push origin HEAD:hotfix-02112-warp-optional-r1
