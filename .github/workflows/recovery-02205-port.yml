name: Recovery 022.05 port and verify

on:
  push:
    branches: [recovery-02205-vless-xmux-warp-updater]

permissions:
  contents: write

jobs:
  port-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[recovery-port-applied]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery-02205-vless-xmux-warp-updater
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Port optional WARP and isolated WSGI updater safety
        run: python deploy/recovery_02205_port.py

      - name: Integrate proven R10 client-detail state
        run: |
          SG_GATEWAY_ROOT="$GITHUB_WORKSPACE" bash deploy/sg-gateway-sg-subscription-native-ui.sh
          printf '%s\n' 'DEV-02205-SGPANEL-XMUX-WARP-UPDATER-R1' > BUILD-ID

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check source syntax
        run: |
          bash -n install.sh
          bash -n deploy/update-from-github.sh
          python -B -c "from pathlib import Path; files=list(Path('app').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('deploy').rglob('*.py'))+list(Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print(f'syntax ok: {len(files)} files')"

      - name: Run new recovery regression tests
        run: |
          python -m pytest -q tests/test_sg_gateway_02205_xmux_sgpanel_contract.py
          python -m pytest -q tests/test_sg_gateway_02205_optional_warp_install.py
          python -m pytest -q tests/test_sg_gateway_02205_update_wsgi_isolation.py

      - name: Run preserved 022.05 regression suites
        run: |
          python -m pytest -q tests/test_sg_subscription_v1_*_02205.py
          python -m pytest -q tests/test_sg_gateway_02205_full_backup_verify.py tests/test_sg_gateway_02205_full_backup_verify_ui.py tests/test_sg_gateway_02205_full_backup_verify_mux.py
          python -m pytest -q tests/test_preview42_template_endpoints.py

      - name: Commit only after all checks pass
        run: |
          git config user.name "sg-gateway-recovery-ci"
          git config user.email "actions@users.noreply.github.com"
          git add install.sh deploy/update-from-github.sh app/web/templates/client_detail.html BUILD-ID
          if git diff --cached --quiet; then
            echo "No port changes to commit"
            exit 0
          fi
          git commit -m "Recovery 022.05: port optional WARP and isolated updater safety [recovery-port-applied]"
          git push origin HEAD:recovery-02205-vless-xmux-warp-updater
