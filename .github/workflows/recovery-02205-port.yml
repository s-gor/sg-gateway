name: Recovery 022.05 final cleanup

on:
  push:
    branches: [recovery-02205-vless-xmux-warp-updater]

permissions:
  contents: write

jobs:
  cleanup-seal:
    if: ${{ !contains(github.event.head_commit.message, '[recovery-port-applied]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery-02205-vless-xmux-warp-updater
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove temporary recovery tooling
        run: |
          git rm .github/workflows/recovery-02205-port.yml
          git rm deploy/recovery_02205_port.py
          git rm deploy/recovery_02205_inline_xmux.py
          git rm deploy/recovery_02205_finalize.py

      - name: Regenerate strict source checksum inventory
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines()
          tracked = sorted(path for path in tracked if path != "SOURCE-SHA256SUMS")
          rows = []
          for rel in tracked:
              path = root / rel
              if not path.is_file():
                  raise SystemExit(f"tracked file missing while sealing inventory: {rel}")
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {rel}")
          (root / "SOURCE-SHA256SUMS").write_text(
              "\n".join(rows) + "\n", encoding="utf-8", newline="\n"
          )
          print(f"sealed {len(rows)} tracked files")
          PY
          git add SOURCE-SHA256SUMS

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run permanent 022.05 contract set
        run: |
          bash -n install.sh
          bash -n deploy/install-from-github.sh
          bash -n deploy/update-from-github.sh
          python -m pytest -q tests/test_sg_gateway_02205_xmux_sgpanel_contract.py
          python -m pytest -q tests/test_sg_gateway_02205_optional_warp_install.py
          python -m pytest -q tests/test_sg_gateway_02205_update_wsgi_isolation.py
          python -m pytest -q tests/test_sg_subscription_v1_*_02205.py
          python -m pytest -q tests/test_sg_gateway_02205_full_backup_verify.py tests/test_sg_gateway_02205_full_backup_verify_ui.py tests/test_sg_gateway_02205_full_backup_verify_mux.py
          python -m pytest -q tests/test_preview42_template_endpoints.py
          python -m pytest -q tests/test_preview31_xray_updates.py::test_manifest_and_updates_ui_declare_safe_update_flow
          python -m pytest -q tests/test_preview52_installer_stage6_and_progress.py::test_installer_uses_sg_panel_progress_contract_and_one_error_path
          python -m pytest -q tests/test_sg_gateway_02112_install_update_split.py
          python -m pytest -q tests/test_version.py
          python -m pytest -q tests/test_sg_gateway_02112_final_cumulative_cleanup_r5.py::test_source_checksum_inventory_is_strict_and_complete

      - name: Run full suite for final historical classification
        continue-on-error: true
        run: python -m pytest -q

      - name: Commit sealed recovery tree
        run: |
          git config user.name "sg-gateway-recovery-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Recovery 022.05: seal SG-Panel XMUX optional WARP updater-safe tree [recovery-port-applied]"
          git push origin HEAD:recovery-02205-vless-xmux-warp-updater
