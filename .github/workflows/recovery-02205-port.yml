name: Recovery 022.05 finalize and verify

on:
  push:
    branches: [recovery-02205-vless-xmux-warp-updater]

permissions:
  contents: write

jobs:
  finalize-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[recovery-port-applied]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery-02205-vless-xmux-warp-updater
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply final 022.05 consistency fixes
        run: python deploy/recovery_02205_finalize.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check source syntax
        run: |
          bash -n install.sh
          bash -n deploy/install-from-github.sh
          bash -n deploy/update-from-github.sh
          python -B -c "from pathlib import Path; files=list(Path('app').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('deploy').rglob('*.py'))+list(Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print(f'syntax ok: {len(files)} files')"

      - name: Run current 022.05 contracts
        run: |
          python -m pytest -q tests/test_sg_gateway_02205_xmux_sgpanel_contract.py
          python -m pytest -q tests/test_sg_gateway_02205_optional_warp_install.py tests/test_sg_gateway_02205_update_wsgi_isolation.py
          python -m pytest -q tests/test_sg_subscription_v1_*_02205.py
          python -m pytest -q tests/test_sg_gateway_02205_full_backup_verify.py tests/test_sg_gateway_02205_full_backup_verify_ui.py tests/test_sg_gateway_02205_full_backup_verify_mux.py
          python -m pytest -q tests/test_preview42_template_endpoints.py

      - name: Run current consistency regressions
        run: |
          python -m pytest -q tests/test_preview31_xray_updates.py::test_manifest_and_updates_ui_declare_safe_update_flow
          python -m pytest -q tests/test_preview52_installer_stage6_and_progress.py::test_installer_uses_sg_panel_progress_contract_and_one_error_path
          python -m pytest -q tests/test_sg_gateway_02112_install_update_split.py
          python -m pytest -q tests/test_version.py

      - name: Run complete repository suite for historical classification
        continue-on-error: true
        run: python -m pytest -q

      - name: Commit only after current contracts pass
        run: |
          git config user.name "sg-gateway-recovery-ci"
          git config user.email "actions@users.noreply.github.com"
          git add install.sh deploy/install-from-github.sh release-manifest.json
          if git diff --cached --quiet; then
            echo "No consistency changes to commit"
            exit 0
          fi
          git commit -m "Recovery 022.05: synchronize installer and release identity [recovery-port-applied]"
          git push origin HEAD:recovery-02205-vless-xmux-warp-updater
