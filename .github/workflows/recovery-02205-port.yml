name: Recovery 022.05 port and verify

on:
  push:
    branches: [recovery-02205-vless-xmux-warp-updater]

permissions:
  contents: write

jobs:
  port-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[recovery-port-applied]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery-02205-vless-xmux-warp-updater
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inline XMUX into preserved 022.05 source
        run: python deploy/recovery_02205_inline_xmux.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify optional WARP and updater safety
        run: |
          grep -q 'SG_GATEWAY_02205_WSGI_ISOLATED_VALIDATION_V1' deploy/update-from-github.sh
          python -m pytest -q tests/test_sg_gateway_02205_optional_warp_install.py tests/test_sg_gateway_02205_update_wsgi_isolation.py

      - name: Verify proven R10 client-detail state
        run: |
          grep -q 'SG_SUBSCRIPTION_DUAL_UI_V1' app/web/templates/client_detail.html
          test "$(grep -c 'SG_SUBSCRIPTION_DUAL_UI_V1' app/web/templates/client_detail.html)" -eq 1
          grep -q 'Legacy SUB устройства' app/web/templates/client_detail.html
          grep -q '^DEV-02205-SGPANEL-XMUX-WARP-UPDATER-R1$' BUILD-ID

      - name: Check source syntax
        run: |
          bash -n install.sh
          bash -n deploy/update-from-github.sh
          python -B -c "from pathlib import Path; files=list(Path('app').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('deploy').rglob('*.py'))+list(Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print(f'syntax ok: {len(files)} files')"

      - name: Run SG-Panel XMUX regression tests
        run: python -m pytest -q tests/test_sg_gateway_02205_xmux_sgpanel_contract.py

      - name: Run preserved 022.05 regression suites
        run: |
          python -m pytest -q tests/test_sg_subscription_v1_*_02205.py
          python -m pytest -q tests/test_sg_gateway_02205_full_backup_verify.py tests/test_sg_gateway_02205_full_backup_verify_ui.py tests/test_sg_gateway_02205_full_backup_verify_mux.py
          python -m pytest -q tests/test_preview42_template_endpoints.py

      - name: Run complete repository test suite for classification
        continue-on-error: true
        run: python -m pytest -q

      - name: Commit in-place source only after targeted checks pass
        run: |
          git config user.name "sg-gateway-recovery-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A app/clients/exports.py app/clients/exports_02205.py app/web/templates/connections.html app/web/templates/connections_02205.html tests/test_sg_gateway_02205_xmux_sgpanel_contract.py
          if git diff --cached --quiet; then
            echo "No in-place changes to commit"
            exit 0
          fi
          git commit -m "Recovery 022.05: inline SG-Panel XMUX without source wrappers [recovery-port-applied]"
          git push origin HEAD:recovery-02205-vless-xmux-warp-updater
