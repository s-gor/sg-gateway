name: Agent WSGI update compatibility fix

on:
  push:
    branches:
      - agent/update-wsgi-compat-20260814

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/update-wsgi-compat-20260814
          fetch-depth: 0

      - name: Apply WSGI compatibility fix
        run: |
          python3 .github/agent-fix-update-wsgi.py
          git add app/production.py deploy/update-from-github.sh tests/test_sg_gateway_02113_update_wsgi_compat.py
          git rm -f .github/agent-fix-update-wsgi.py .github/workflows/agent-fix-update-wsgi.yml
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          rows = []
          for relative in tracked:
              if relative == "SOURCE-SHA256SUMS":
                  continue
              path = Path(relative)
              if not path.is_file():
                  continue
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {relative}")
          Path("SOURCE-SHA256SUMS").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY
          git add SOURCE-SHA256SUMS
          git diff --cached --check

      - name: Commit fix
        run: |
          git config user.name "SG-Gateway automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Fix panel update WSGI compatibility"
          git push origin HEAD:agent/update-wsgi-compat-20260814
