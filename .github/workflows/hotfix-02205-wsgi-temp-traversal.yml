name: Hotfix 022.05 WSGI temp traversal

on:
  push:
    branches: [hotfix-02205-wsgi-temp-traversal]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[wsgi-temp-fixed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-02205-wsgi-temp-traversal
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact patch
        run: python deploy/hotfix_02205_wsgi_temp_traversal.py
      - name: Shell syntax
        run: bash -n deploy/update-from-github.sh
      - name: Install test dependencies
        run: python -m pip install -q -r requirements-dev.txt
      - name: Updater regression
        run: python -m pytest -q tests/test_sg_gateway_02205_update_wsgi_isolation.py
      - name: Permission semantics
        run: |
          d="$(mktemp -d)"
          mkdir -p "$d/wsgi-validation/data"
          chmod 0700 "$d"
          sudo chown -R nobody:nogroup "$d/wsgi-validation"
          if sudo -u nobody test -d "$d/wsgi-validation/data"; then exit 1; fi
          chmod 0711 "$d"
          sudo -u nobody test -d "$d/wsgi-validation/data"
          chmod 0700 "$d"
          sudo rm -rf "$d"
      - name: Remove temporary hotfix scaffolding from final tree
        run: git rm -f deploy/hotfix_02205_wsgi_temp_traversal.py .github/workflows/hotfix-02205-wsgi-temp-traversal.yml
      - name: Full repository suite
        run: python -m pytest -q
      - name: Commit only verified code
        run: |
          git config user.name "sg-gateway-hotfix-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix updater WSGI temp traversal [wsgi-temp-fixed]"
          git push origin HEAD:hotfix-02205-wsgi-temp-traversal
