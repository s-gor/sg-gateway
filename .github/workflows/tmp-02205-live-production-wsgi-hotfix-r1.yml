name: TEMP 022.05 LIVE Production WSGI Hotfix R1

on:
  push:
    branches: [hotfix-02205-live-production-wsgi-r1]

permissions:
  contents: write

jobs:
  verify-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hotfix-02205-live-production-wsgi-r1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Fix real installer WSGI target
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('install.sh')
          text = path.read_text(encoding='utf-8')

          old_smoke = "from app.main import create_app\napp = create_app()\n"
          new_smoke = "from app.production import app\n"
          if text.count(old_smoke) != 1:
              raise SystemExit(f'expected one installer smoke app.main factory, found {text.count(old_smoke)}')
          text = text.replace(old_smoke, new_smoke, 1)

          old_exec = 'ExecStart=${PREFIX}/.venv/bin/waitress-serve --host=\\${SG_GATEWAY_HOST} --port=\\${SG_GATEWAY_PORT} app.main:app'
          new_exec = 'ExecStart=${PREFIX}/.venv/bin/waitress-serve --host=\\${SG_GATEWAY_HOST} --port=\\${SG_GATEWAY_PORT} app.production:app'
          if text.count(old_exec) != 1:
              raise SystemExit(f'expected one generated service app.main target, found {text.count(old_exec)}')
          text = text.replace(old_exec, new_exec, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add installer regression
        run: |
          cat > tests/test_sg_gateway_02205_installer_production_wsgi_hotfix.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]

          def _installer() -> str:
              return (ROOT / 'install.sh').read_text(encoding='utf-8')

          def test_installer_smoke_uses_real_production_entrypoint() -> None:
              text = _installer()
              start = text.index('stage_local_application_smoke_test()')
              end = text.index('saved_https_access()', start)
              block = text[start:end]
              assert 'from app.production import app' in block
              assert 'from app.main import create_app' not in block
              assert 'app = create_app()' not in block

          def test_installer_generated_panel_unit_uses_production_entrypoint() -> None:
              text = _installer()
              start = text.index('stage_systemd_units()')
              end = text.index('stage_firewall_and_network()', start)
              block = text[start:end]
              assert 'app.production:app' in block
              assert 'app.main:app' not in block

          def test_production_entrypoint_registers_subscription_helpers() -> None:
              from app.production import app
              with app.test_request_context('/'):
                  context = {}
                  for processor in app.template_context_processors[None]:
                      context.update(processor())
              assert callable(context.get('sg_subscription_universal_url'))
              assert callable(context.get('sg_subscription_native_url'))
          PY

      - name: Remove temporary workflow and stage product files
        run: |
          git rm .github/workflows/tmp-02205-live-production-wsgi-hotfix-r1.yml
          git add install.sh tests/test_sg_gateway_02205_installer_production_wsgi_hotfix.py

      - name: Focused verification
        run: |
          bash -n install.sh
          python -m pytest -q \
            tests/test_sg_gateway_02205_installer_production_wsgi_hotfix.py \
            tests/test_sg_subscription_v1_production_02205.py \
            tests/test_sg_subscription_v1_dual_ui_02205.py

      - name: Refresh strict source inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          raw = subprocess.check_output(['git','ls-files','-z'])
          names = sorted(x.decode() for x in raw.split(b'\0') if x and x.decode() != 'SOURCE-SHA256SUMS')
          Path('SOURCE-SHA256SUMS').write_text(''.join(f"{hashlib.sha256(Path(n).read_bytes()).hexdigest()}  {n}\n" for n in names), encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          sha256sum -c SOURCE-SHA256SUMS >/dev/null

      - name: Full repository suite
        run: python -m pytest -q

      - name: Clean test artifacts and refresh inventory
        run: |
          rm -f data/system-activity.json
          git clean -fdX
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          raw = subprocess.check_output(['git','ls-files','-z'])
          names = sorted(x.decode() for x in raw.split(b'\0') if x and x.decode() != 'SOURCE-SHA256SUMS')
          Path('SOURCE-SHA256SUMS').write_text(''.join(f"{hashlib.sha256(Path(n).read_bytes()).hexdigest()}  {n}\n" for n in names), encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          sha256sum -c SOURCE-SHA256SUMS >/dev/null

      - name: Verify LIVE identity and minimal scope
        run: |
          test "$(tr -d '\r\n' < VERSION)" = '0.1.0-022.05'
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest=json.loads(Path('release-manifest.json').read_text(encoding='utf-8'))
          assert manifest['status'] == 'LIVE'
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only','a0c2537b6c55d1fd974afe3aab586a7d41777cd8','--']).decode().splitlines())
          expected={'install.sh','SOURCE-SHA256SUMS','tests/test_sg_gateway_02205_installer_production_wsgi_hotfix.py'}
          assert changed == expected, (changed, expected)
          PY

      - name: Finalize verified LIVE candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'Hotfix 022.05 clean-install production WSGI target'

      - name: Build and verify published FULL
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          OUT="/tmp/SG-Gateway-${VERSION}-FULL.run"
          bash build-run.sh "$OUT"
          "$OUT" --verify-only
          test -s "${OUT%.run}-SHA256.txt"
          test -s "${OUT%.run}-TRANSFER.zip"
          unzip -t "${OUT%.run}-TRANSFER.zip" >/dev/null

      - name: Publish verified candidate
        run: git push origin HEAD:hotfix-02205-live-production-wsgi-r1
