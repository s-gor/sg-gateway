name: CI 022.05 Development

on:
  push:
    branches: [dev-02205]
  pull_request:
    branches: [dev-02205]

jobs:
  recovery-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check source syntax
        run: |
          bash -n install.sh
          bash -n deploy/install-from-github.sh
          bash -n deploy/update-from-github.sh
          python -B -c "from pathlib import Path; files=list(Path('app').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('deploy').rglob('*.py'))+list(Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print(f'syntax ok: {len(files)} files')"

      - name: Run SG-Panel XMUX contract
        run: python -m pytest -q tests/test_sg_gateway_02205_xmux_sgpanel_contract.py

      - name: Run optional WARP and updater isolation contracts
        run: |
          python -m pytest -q tests/test_sg_gateway_02205_optional_warp_install.py
          python -m pytest -q tests/test_sg_gateway_02205_update_wsgi_isolation.py

      - name: Run SG Subscription v1 tests
        run: python -m pytest -q tests/test_sg_subscription_v1_*_02205.py

      - name: Run Full Backup verification tests
        run: |
          python -m pytest -q tests/test_sg_gateway_02205_full_backup_verify.py tests/test_sg_gateway_02205_full_backup_verify_ui.py tests/test_sg_gateway_02205_full_backup_verify_mux.py

      - name: Preserve main endpoint source contract
        run: python -m pytest -q tests/test_preview42_template_endpoints.py

      - name: Verify installer release and source integrity
        run: |
          python -m pytest -q tests/test_preview31_xray_updates.py::test_manifest_and_updates_ui_declare_safe_update_flow
          python -m pytest -q tests/test_preview52_installer_stage6_and_progress.py::test_installer_uses_sg_panel_progress_contract_and_one_error_path
          python -m pytest -q tests/test_sg_gateway_02112_install_update_split.py
          python -m pytest -q tests/test_version.py
          python -m pytest -q tests/test_sg_gateway_02112_final_cumulative_cleanup_r5.py::test_source_checksum_inventory_is_strict_and_complete
