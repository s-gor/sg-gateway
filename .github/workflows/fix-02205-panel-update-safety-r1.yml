name: Harden 022.05 panel update safety

on:
  push:
    branches:
      - fix-02205-panel-update-safety-r1

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch panel update channel and safe delegation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/maintenance/panel_updates.py')
          body = path.read_text(encoding='utf-8')
          anchor = 'GITHUB_REPO = os.getenv("SG_GATEWAY_UPDATE_REPO", "s-gor/sg-gateway").strip() or "s-gor/sg-gateway"\n'
          assert body.count(anchor) == 1
          body = body.replace(anchor, anchor + 'GITHUB_BRANCH = os.getenv("SG_GATEWAY_UPDATE_BRANCH", "dev-02205").strip() or "dev-02205"\n')
          replacements = {
              'def _latest_main() -> tuple[str, str, str]:': 'def _latest_channel() -> tuple[str, str, str]:',
              'f"{GITHUB_API}/commits/main"': 'f"{GITHUB_API}/commits/{GITHUB_BRANCH}"',
              'f"https://github.com/{GITHUB_REPO}/commits/main.atom"': 'f"https://github.com/{GITHUB_REPO}/commits/{GITHUB_BRANCH}.atom"',
              'sha, latest_date, html_url = _latest_main()': 'sha, latest_date, html_url = _latest_channel()',
              '"Локальная база уже соответствует проверенному GitHub main."': 'f"Локальная база уже соответствует проверенному GitHub {GITHUB_BRANCH}."',
              '"GitHub main содержит новый commit. Можно выполнить безопасное обновление панели."': 'f"GitHub {GITHUB_BRANCH} содержит новый commit. Можно выполнить безопасное обновление панели."',
              '"Проверка GitHub main не выполнена."': 'f"Проверка GitHub {GITHUB_BRANCH} не выполнена."',
              '"GitHub не вернул commit main"': '"GitHub не вернул commit update-channel"',
              '"GitHub main не удалось определить ни через API, ни через Atom feed"': 'f"GitHub {GITHUB_BRANCH} не удалось определить ни через API, ни через Atom feed"',
              'f"Не удалось проверить GitHub main: {first_exc}; fallback: {second_exc}"': 'f"Не удалось проверить GitHub {GITHUB_BRANCH}: {first_exc}; fallback: {second_exc}"',
          }
          for old, new in replacements.items():
              assert old in body, old
              body = body.replace(old, new)
          body = body.replace('            "repo": GITHUB_REPO,\n', '            "repo": GITHUB_REPO,\n            "channel": GITHUB_BRANCH,\n')
          path.write_text(body, encoding='utf-8', newline='\n')

          path = Path('hostd/sg_hostd/operation_jobs.py')
          body = path.read_text(encoding='utf-8')
          import_anchor = 'from typing import Any, Sequence\n'
          assert body.count(import_anchor) == 1
          body = body.replace(import_anchor, import_anchor + '\nfrom app.maintenance.panel_updates import GITHUB_BRANCH\n')
          const_anchor = 'PANEL_ACCESS_SCRIPT = Path("/opt/sg-gateway/deploy/configure-panel-access.sh")\n'
          assert body.count(const_anchor) == 1
          body = body.replace(const_anchor, const_anchor + 'PANEL_UPDATE_SCRIPT = Path("/opt/sg-gateway/deploy/update-from-github.sh")\n')
          old = '''def start_panel_update_job() -> dict[str, Any]:
    return _start(
        "panel_update_main",
        "Безопасное обновление SG-Gateway из GitHub main",
        "/maintenance?tab=updates&refresh=1",
        "/maintenance?tab=updates",
    )
'''
          new = '''def start_panel_update_job() -> dict[str, Any]:
    if not PANEL_UPDATE_SCRIPT.is_file():
        raise RuntimeError(f"Не найден {PANEL_UPDATE_SCRIPT}")
    return _start(
        "panel_update_channel",
        f"Безопасное обновление SG-Gateway из GitHub {GITHUB_BRANCH}",
        "/maintenance?tab=updates&refresh=1",
        "/maintenance?tab=updates",
        {"channel": GITHUB_BRANCH, "restart_expected": True},
        command=(
            "/usr/bin/env",
            f"SG_GATEWAY_GITHUB_BRANCH={GITHUB_BRANCH}",
            "/bin/bash",
            str(PANEL_UPDATE_SCRIPT),
        ),
    )
'''
          assert body.count(old) == 1
          body = body.replace(old, new)
          path.write_text(body, encoding='utf-8', newline='\n')

          path = Path('hostd/sg_hostd/operation_job_runner.py')
          body = path.read_text(encoding='utf-8')
          assert 'import subprocess\n' not in body
          body = body.replace('import os\n', 'import os\nimport subprocess\n', 1)
          old = '''def run_panel_update() -> int:
    from sg_hostd.panel_update_runtime import update_panel

    print("[SG-Gateway Update] Подготавливаю транзакционное обновление панели", flush=True)
    _dump(update_panel())
    return 0
'''
          new = '''def run_panel_update() -> int:
    from app.maintenance.panel_updates import GITHUB_BRANCH

    script = _PROJECT_ROOT / "deploy" / "update-from-github.sh"
    if not script.is_file():
        raise RuntimeError(f"Не найден {script}")
