    env["SG_GATEWAY_GITHUB_BRANCH"] = GITHUB_BRANCH
    print(f"[SG-Gateway Update] Запускаю проверенный updater · channel {GITHUB_BRANCH}", flush=True)
    completed = subprocess.run(
        ["/bin/bash", str(script)],
        cwd=str(_PROJECT_ROOT),
        env=env,
        check=False,
    )
    return int(completed.returncode)
'''
          assert body.count(old) == 1
          body = body.replace(old, new)
          path.write_text(body, encoding='utf-8', newline='\n')

          path = Path('hostd/sg_hostd/panel_update_runtime.py')
          body = path.read_text(encoding='utf-8')
          old_import = 'from app.maintenance.panel_updates import GITHUB_API, GITHUB_REPO, STATE_FILE, source_fingerprint\n'
          new_import = 'from app.maintenance.panel_updates import GITHUB_API, GITHUB_BRANCH, GITHUB_REPO, STATE_FILE, source_fingerprint\n'
          assert body.count(old_import) == 1
          body = body.replace(old_import, new_import)
          runtime_replacements = {
              'def _latest_main_commit() -> str:': 'def _latest_channel_commit() -> str:',
              'f"{GITHUB_API}/commits/main"': 'f"{GITHUB_API}/commits/{GITHUB_BRANCH}"',
              '"GitHub не вернул commit main"': '"GitHub не вернул commit update-channel"',
              '"GitHub вернул некорректный SHA main"': '"GitHub вернул некорректный SHA update-channel"',
              'f"https://github.com/{GITHUB_REPO}/commits/main.atom"': 'f"https://github.com/{GITHUB_REPO}/commits/{GITHUB_BRANCH}.atom"',
              'f"GitHub main недоступен: {exc}"': 'f"GitHub {GITHUB_BRANCH} недоступен: {exc}"',
              '"GitHub main не удалось определить ни через API, ни через Atom feed"': 'f"GitHub {GITHUB_BRANCH} не удалось определить ни через API, ни через Atom feed"',
          }
          for old_text, new_text in runtime_replacements.items():
              assert old_text in body, old_text
              body = body.replace(old_text, new_text)
          old_env = '''    env["SG_GATEWAY_ENV"] = "production"
    env["SG_GATEWAY_DATA_DIR"] = "/var/lib/sg-gateway"
    env["SG_GATEWAY_LOG_DIR"] = "/var/log/sg-gateway"
    check = subprocess.run(
'''
          new_env = '''    env["SG_GATEWAY_ENV"] = "production"
    validation_root = root.parent / "wsgi-validation"
    (validation_root / "data").mkdir(parents=True, exist_ok=True)
    (validation_root / "log").mkdir(parents=True, exist_ok=True)
    env["SG_GATEWAY_DATA_DIR"] = str(validation_root / "data")
    env["SG_GATEWAY_LOG_DIR"] = str(validation_root / "log")
    check = subprocess.run(
'''
          assert body.count(old_env) == 1
          body = body.replace(old_env, new_env)
          start = body.index('def update_panel() -> dict[str, Any]:')
          safe_update = '''def update_panel() -> dict[str, Any]:
    """Compatibility entrypoint: delegate to the verified full-state shell updater."""
    script = LIVE_ROOT / "deploy" / "update-from-github.sh"
    if not script.is_file():
        raise PanelUpdateRuntimeError(f"Не найден безопасный updater: {script}")
    env = dict(os.environ)
    env["SG_GATEWAY_GITHUB_BRANCH"] = GITHUB_BRANCH
    completed = subprocess.run(
        ["/bin/bash", str(script)],
        cwd=str(LIVE_ROOT),
        env=env,
        capture_output=True,
        text=True,
        timeout=1800,
        check=False,
    )
    output = "\\n".join(part.strip() for part in (completed.stdout, completed.stderr) if part and part.strip())
    if output:
        print(output, flush=True)
    if completed.returncode:
        raise PanelUpdateRuntimeError(output.splitlines()[-1] if output else f"safe updater failed: rc={completed.returncode}")
    version = (LIVE_ROOT / "VERSION").read_text(encoding="utf-8").strip()
    return {
        "ok": True,
        "message": f"SG-Gateway безопасно обновлён из GitHub {GITHUB_BRANCH}; VERSION {version}",
        "channel": GITHUB_BRANCH,
        "version": version,
    }
'''
          body = body[:start] + safe_update
          path.write_text(body, encoding='utf-8', newline='\n')
          PY

      - name: Update release manifest safety contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('release-manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['client_access_model']['sg_panel_transfer_status'] = 'live-validated-2026-08-15'
          panel = data['maintenance_updates']['panel']
          panel['source'] = 'github-channel-via-verified-shell-updater'
          panel['channel'] = 'dev-02205'
          panel['staged_import_data'] = 'isolated-temp-data-log'
          panel['state_backup'] = 'full-shell-updater-safety-backup'
          data['source_integrity']['mode'] = 'sha256-file-inventory'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Add panel updater safety regression
        shell: bash
        run: |
          cat > tests/test_sg_gateway_02205_panel_update_safety.py <<'PY'
          from pathlib import Path
          ROOT = Path(__file__).resolve().parents[1]

          def _function_block(body: str, name: str) -> str:
              start = body.index(f"def {name}(")
              next_def = body.find("\ndef ", start + 5)
              return body[start:] if next_def < 0 else body[start:next_def]

          def test_panel_update_overview_uses_02205_channel_not_main() -> None:
              body = (ROOT / "app/maintenance/panel_updates.py").read_text(encoding="utf-8")
              assert 'GITHUB_BRANCH = os.getenv("SG_GATEWAY_UPDATE_BRANCH", "dev-02205")' in body
              latest = _function_block(body, "_latest_channel")
              assert 'commits/{GITHUB_BRANCH}' in latest
              assert 'commits/main' not in latest

          def test_panel_update_job_delegates_to_verified_shell_updater() -> None:
              body = (ROOT / "hostd/sg_hostd/operation_jobs.py").read_text(encoding="utf-8")
              block = _function_block(body, "start_panel_update_job")
              assert 'PANEL_UPDATE_SCRIPT' in block
              assert 'SG_GATEWAY_GITHUB_BRANCH={GITHUB_BRANCH}' in block
              assert 'command=(' in block
              assert 'panel_update_channel' in block

          def test_legacy_panel_update_runner_is_also_safe() -> None:
              body = (ROOT / "hostd/sg_hostd/operation_job_runner.py").read_text(encoding="utf-8")
              block = _function_block(body, "run_panel_update")
              assert 'update-from-github.sh' in block
              assert 'SG_GATEWAY_GITHUB_BRANCH' in block
              assert 'panel_update_runtime' not in block

          def test_old_python_staging_import_cannot_touch_production_db() -> None:
              body = (ROOT / "hostd/sg_hostd/panel_update_runtime.py").read_text(encoding="utf-8")
              block = _function_block(body, "_validate_snapshot")
              assert 'validation_root = root.parent / "wsgi-validation"' in block
              assert 'env["SG_GATEWAY_DATA_DIR"] = str(validation_root / "data")' in block
              assert 'env["SG_GATEWAY_LOG_DIR"] = str(validation_root / "log")' in block
              assert 'env["SG_GATEWAY_DATA_DIR"] = "/var/lib/sg-gateway"' not in block

          def test_python_update_entrypoint_delegates_instead_of_mutating_source_itself() -> None:
              body = (ROOT / "hostd/sg_hostd/panel_update_runtime.py").read_text(encoding="utf-8")
              block = _function_block(body, "update_panel")
              assert 'deploy" / "update-from-github.sh"' in block
              assert 'SG_GATEWAY_GITHUB_BRANCH' in block
              assert '_backup_live(' not in block
              assert '_deploy_source(' not in block

          def test_legacy_runtime_helpers_are_channel_aware() -> None:
              body = (ROOT / "hostd/sg_hostd/panel_update_runtime.py").read_text(encoding="utf-8")
              latest = _function_block(body, "_latest_channel_commit")
              assert 'commits/{GITHUB_BRANCH}' in latest
              assert 'commits/main' not in latest
          PY

      - name: Normalize historical maintenance tests to current safe contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_sg_gateway_021_maintenance_updates_v1.py')
          body = path.read_text(encoding='utf-8')
          body = body.replace('def test_panel_update_overview_pins_exact_main_commit_but_blocks_unbound_baseline', 'def test_panel_update_overview_pins_exact_channel_commit_but_blocks_unbound_baseline')
          old = '''def test_panel_runtime_blocks_dependency_changes_and_has_rollback():
    runtime = (ROOT / "hostd/sg_hostd/panel_update_runtime.py").read_text(encoding="utf-8")
    assert "requirements.txt изменён" in runtime
    assert "_backup_live" in runtime
    assert "_deploy_source(backup)" in runtime
    assert "commits/main" in runtime
    assert "archive/{commit}.tar.gz" in runtime
    assert ".venv" in runtime
    assert "_baseline_mode" in runtime
    assert "Автоматическое обновление сейчас недоступно." in runtime
    assert "локальный исходник не совпадает" not in runtime
'''
          new = '''def test_panel_runtime_blocks_dependency_changes_and_delegates_full_state_rollback():
    runtime = (ROOT / "hostd/sg_hostd/panel_update_runtime.py").read_text(encoding="utf-8")
    assert "requirements.txt изменён" in runtime
    assert "_baseline_mode" in runtime
    assert "Автоматическое обновление сейчас недоступно." in runtime
    assert 'validation_root = root.parent / "wsgi-validation"' in runtime
    update = runtime[runtime.index("def update_panel() -> dict[str, Any]:"):]
    assert 'deploy" / "update-from-github.sh"' in update
    assert 'SG_GATEWAY_GITHUB_BRANCH' in update
    assert '_deploy_source(backup)' not in update
    assert "локальный исходник не совпадает" not in runtime
'''
          assert body.count(old) == 1
          body = body.replace(old, new)
          assert body.count('monkeypatch.setattr(panel_updates, "_latest_main"') == 2
          body = body.replace('monkeypatch.setattr(panel_updates, "_latest_main"', 'monkeypatch.setattr(panel_updates, "_latest_channel"')
          old = '''def test_panel_runtime_has_bootstrap_path_and_atom_fallback():
    runtime = (ROOT / "hostd/sg_hostd/panel_update_runtime.py").read_text(encoding="utf-8")
    assert "def _baseline_mode" in runtime
    assert 'return "bootstrap", {}' in runtime
    assert "строго более новую VERSION" in runtime
    assert "updater-baseline" not in runtime
    assert "commits/main.atom" in runtime
'''
          new = '''def test_panel_update_has_bootstrap_gate_and_channel_atom_fallback():
    overview = (ROOT / "app/maintenance/panel_updates.py").read_text(encoding="utf-8")
    runtime = (ROOT / "hostd/sg_hostd/panel_update_runtime.py").read_text(encoding="utf-8")
    assert "def _baseline_mode" in runtime
    assert 'return "bootstrap", {}' in runtime
    assert "updater-baseline" not in runtime
    assert 'GITHUB_BRANCH = os.getenv("SG_GATEWAY_UPDATE_BRANCH", "dev-02205")' in overview
    assert 'commits/{GITHUB_BRANCH}.atom' in overview
    assert "commits/main.atom" not in overview
'''
          assert body.count(old) == 1
          body = body.replace(old, new)
          path.write_text(body, encoding='utf-8', newline='\n')
          PY

      - name: Python and shell syntax
        shell: bash
        run: |
          python -m compileall -q app hostd/sg_hostd
          bash -n deploy/update-from-github.sh

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Focused safety regression
        run: |
          pytest -q \
            tests/test_sg_gateway_02205_panel_update_safety.py \
            tests/test_sg_gateway_021_maintenance_updates_v1.py \
            tests/test_sg_gateway_02205_update_wsgi_isolation.py \
            tests/test_sg_gateway_02205_installer_identity.py \
            tests/test_sg_gateway_02205_optional_warp_install.py \
            tests/test_sg_gateway_02205_xmux_sgpanel_contract.py

      - name: Remove CI scaffolding and generated runtime data
        shell: bash
        run: |
          git rm .github/workflows/fix-02205-panel-update-safety-r1.yml
          rm -f data/system-activity.json
          git add app/maintenance/panel_updates.py hostd/sg_hostd/operation_jobs.py hostd/sg_hostd/operation_job_runner.py hostd/sg_hostd/panel_update_runtime.py release-manifest.json tests/test_sg_gateway_021_maintenance_updates_v1.py tests/test_sg_gateway_02205_panel_update_safety.py

      - name: Rebuild strict source checksum inventory
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          paths = sorted(p.decode('utf-8') for p in tracked if p and p.decode('utf-8') != 'SOURCE-SHA256SUMS')
          lines = [f"{hashlib.sha256(Path(raw).read_bytes()).hexdigest()}  {raw}" for raw in paths if Path(raw).is_file()]
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          print(f'SOURCE-SHA256SUMS entries={len(lines)}')
          PY

      - name: Full repository suite
        run: pytest -q

      - name: Remove post-test generated runtime data
        run: rm -f data/system-activity.json

      - name: Verify final diff scope
        shell: bash
        run: |
          git status --short
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD']).decode().splitlines())
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', 'HEAD']).decode().splitlines())
          all_changed = changed | staged
          allowed = {'app/maintenance/panel_updates.py','hostd/sg_hostd/operation_jobs.py','hostd/sg_hostd/operation_job_runner.py','hostd/sg_hostd/panel_update_runtime.py','release-manifest.json','tests/test_sg_gateway_021_maintenance_updates_v1.py','tests/test_sg_gateway_02205_panel_update_safety.py','SOURCE-SHA256SUMS','.github/workflows/fix-02205-panel-update-safety-r1.yml'}
          unexpected = all_changed - allowed
          assert not unexpected, sorted(unexpected)
          required = allowed - {'.github/workflows/fix-02205-panel-update-safety-r1.yml'}
          assert required <= all_changed, sorted(required - all_changed)
          print('Final diff scope: OK')
          PY

      - name: Commit verified safety fix
        shell: bash
        run: |
          git config user.name 'sg-gateway-panel-update-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Harden 022.05 built-in panel updater'
          git push origin HEAD:fix-02205-panel-update-safety-r1
