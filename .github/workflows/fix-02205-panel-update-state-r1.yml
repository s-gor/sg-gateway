name: Fix 022.05 Panel Update state binding

on:
  push:
    branches:
      - fix-02205-panel-update-state-r1

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch updater and add regression
        run: python .github/scripts/fix-02205-panel-update-state-r1.py

      - name: Shell syntax
        run: bash -n deploy/update-from-github.sh

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Focused regression
        run: |
          pytest -q \
            tests/test_sg_gateway_02205_panel_update_state_binding.py \
            tests/test_sg_gateway_02205_panel_update_safety.py \
            tests/test_sg_gateway_02205_update_channel_defaults.py \
            tests/test_sg_gateway_02205_update_wsgi_isolation.py \
            tests/test_sg_gateway_021_maintenance_updates_v1.py

      - name: Remove CI scaffolding and generated runtime data
        run: |
          git rm .github/workflows/fix-02205-panel-update-state-r1.yml
          git rm .github/scripts/fix-02205-panel-update-state-r1.py
          rm -f data/system-activity.json
          git add deploy/update-from-github.sh tests/test_sg_gateway_02205_panel_update_state_binding.py

      - name: Rebuild strict source checksum inventory
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          paths = sorted(
              p.decode('utf-8') for p in tracked
              if p and p.decode('utf-8') != 'SOURCE-SHA256SUMS'
          )
          lines = []
          for raw in paths:
              path = Path(raw)
              if not path.is_file():
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  {raw}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          print(f'SOURCE-SHA256SUMS entries={len(lines)}')
          PY

      - name: Full repository suite
        run: pytest -q

      - name: Remove post-test generated runtime data
        run: rm -f data/system-activity.json

      - name: Verify final diff scope
        run: |
          git status --short
          python - <<'PY'
          import subprocess

          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD']).decode().splitlines())
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', 'HEAD']).decode().splitlines())
          all_changed = changed | staged
          allowed = {
              'deploy/update-from-github.sh',
              'tests/test_sg_gateway_02205_panel_update_state_binding.py',
              'SOURCE-SHA256SUMS',
              '.github/workflows/fix-02205-panel-update-state-r1.yml',
              '.github/scripts/fix-02205-panel-update-state-r1.py',
          }
          unexpected = all_changed - allowed
          assert not unexpected, sorted(unexpected)
          assert 'deploy/update-from-github.sh' in all_changed
          assert 'tests/test_sg_gateway_02205_panel_update_state_binding.py' in all_changed
          assert 'SOURCE-SHA256SUMS' in all_changed
          print('Final diff scope: OK')
          PY

      - name: Commit verified fix
        run: |
          git config user.name 'sg-gateway-panel-state-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Bind Panel Update state after verified update'
          git push origin HEAD:fix-02205-panel-update-state-r1
