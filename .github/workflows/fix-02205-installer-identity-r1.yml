name: Fix 022.05 installer identity

on:
  push:
    branches:
      - fix-02205-installer-identity-r1

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch exact stale installer identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('install.sh')
          body = path.read_text(encoding='utf-8')

          old_banner = "  printf '\\n%sSG-Gateway 0.1.0-022.01%s\\n' \"$CYAN\" \"$RESET\""
          new_banner = "  printf '\\n%sSG-Gateway %s%s\\n' \"$CYAN\" \"$VERSION\" \"$RESET\""
          old_backup = '  BACKUP_DIR="$BACKUP_ROOT/$(date +%Y%m%d-%H%M%S)-before-sg-gateway-02201"'
          new_backup = '  BACKUP_DIR="$BACKUP_ROOT/$(date +%Y%m%d-%H%M%S)-before-sg-gateway-02205"'

          assert body.count(old_banner) == 1, f'old banner occurrences={body.count(old_banner)}'
          assert body.count(old_backup) == 1, f'old backup occurrences={body.count(old_backup)}'
          body = body.replace(old_banner, new_banner)
          body = body.replace(old_backup, new_backup)
          path.write_text(body, encoding='utf-8', newline='\n')
          PY

      - name: Add installer identity regression
        shell: bash
        run: |
          cat > tests/test_sg_gateway_02205_installer_identity.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]


          def _main_block(body: str) -> str:
              start = body.index("main() {")
              return body[start:]


          def test_02205_installer_identity_is_consistent() -> None:
              body = (ROOT / "install.sh").read_text(encoding="utf-8")
              main = _main_block(body)

              assert 'VERSION="0.1.0-022.05"' in body
              assert 'INSTALLER_BUILD="02205-sgpanel-xmux-warp-updater-r1"' in body
              assert 'INSTALL_LOG="/var/log/sg-gateway-installer-02205.log"' in body
              assert 'RESUME_FILE="/root/sg-gateway-02205-installer-resume.env"' in body

              assert "printf '\\n%sSG-Gateway %s%s\\n' \"$CYAN\" \"$VERSION\" \"$RESET\"" in main
              assert 'before-sg-gateway-02205"' in main

              assert "SG-Gateway 0.1.0-022.01" not in main
              assert "before-sg-gateway-02201" not in main


          def test_02205_installer_stage_identity_remains_ten_stage() -> None:
              body = (ROOT / "install.sh").read_text(encoding="utf-8")
              main = _main_block(body)
              assert "TOTAL_STAGES=10" in body
              for stage in range(1, 11):
                  assert f"run_stage {stage} " in main
              assert 'run_stage 10 "Запуск и проверка" stage10_start_and_verify' in main
          PY

      - name: Audit current identity and WARP final path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          body = Path('install.sh').read_text(encoding='utf-8')
          main = body[body.index('main() {'):]

          required = [
              'VERSION="0.1.0-022.05"',
              'INSTALLER_BUILD="02205-sgpanel-xmux-warp-updater-r1"',
              'INSTALL_LOG="/var/log/sg-gateway-installer-02205.log"',
              'RESUME_FILE="/root/sg-gateway-02205-installer-resume.env"',
              'before-sg-gateway-02205',
          ]
          for marker in required:
              assert marker in body, marker

          assert 'SG-Gateway 0.1.0-022.01' not in main
          assert 'before-sg-gateway-02201' not in main

          def function_block(name: str) -> str:
              start = body.index(f'{name}() {{')
              end = body.index('\n}\n', start) + 3
              return body[start:end]

          assert 'stage9_ensure_warp' not in function_block('stage10_start_and_verify')
          assert 'stage9_ensure_warp' not in function_block('run_final_stage')

          current_identity_hits = []
          for lineno, line in enumerate(body.splitlines(), 1):
              if re.search(r'(SG-Gateway 0\.1\.0-022\.0[0-4]|before-sg-gateway-0220[0-4]|installer-0220[0-4]\.log|sg-gateway-0220[0-4]-installer-resume)', line):
                  current_identity_hits.append((lineno, line))
          forbidden = [(n, l) for n, l in current_identity_hits if n >= body[:body.index('main() {')].count('\n') + 1 and ('printf' in l or 'BACKUP_DIR=' in l)]
          assert not forbidden, forbidden
          print('Installer identity audit: OK')
          PY

      - name: Shell syntax
        run: bash -n install.sh

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Focused regression
        run: |
          pytest -q \
            tests/test_sg_gateway_02205_installer_identity.py \
            tests/test_sg_gateway_02205_optional_warp_install.py \
            tests/test_sg_gateway_02205_update_wsgi_isolation.py \
            tests/test_sg_gateway_02205_xmux_sgpanel_contract.py

      - name: Remove CI scaffolding and generated runtime data
        shell: bash
        run: |
          git rm .github/workflows/fix-02205-installer-identity-r1.yml
          rm -f data/system-activity.json
          git add install.sh tests/test_sg_gateway_02205_installer_identity.py

      - name: Rebuild strict source checksum inventory
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          paths = sorted(
              p.decode('utf-8') for p in tracked
              if p and p.decode('utf-8') != 'SOURCE-SHA256SUMS'
          )
          lines = []
          for raw in paths:
              path = Path(raw)
              if not path.is_file():
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  {raw}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          print(f'SOURCE-SHA256SUMS entries={len(lines)}')
          PY

      - name: Full repository suite
        run: pytest -q

      - name: Remove post-test generated runtime data
        run: rm -f data/system-activity.json

      - name: Verify final diff scope
        shell: bash
        run: |
          git status --short
          python - <<'PY'
          import subprocess

          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD']).decode().splitlines())
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', 'HEAD']).decode().splitlines())
          all_changed = changed | staged
          allowed = {
              'install.sh',
              'tests/test_sg_gateway_02205_installer_identity.py',
              'SOURCE-SHA256SUMS',
              '.github/workflows/fix-02205-installer-identity-r1.yml',
          }
          unexpected = all_changed - allowed
          assert not unexpected, sorted(unexpected)
          assert 'install.sh' in all_changed
          assert 'tests/test_sg_gateway_02205_installer_identity.py' in all_changed
          assert 'SOURCE-SHA256SUMS' in all_changed
          print('Final diff scope: OK')
          PY

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'sg-gateway-installer-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix 022.05 clean-installer identity'
          git push origin HEAD:fix-02205-installer-identity-r1
