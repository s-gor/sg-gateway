name: TEMP 022.05 Production WSGI Hotfix R1

on:
  push:
    branches: [hotfix-02205-production-wsgi-r1]

permissions:
  contents: write

jobs:
  verify-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: hotfix-02205-production-wsgi-r1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Fix installer production WSGI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('install.sh')
          text = path.read_text(encoding='utf-8')

          old_smoke = "from app.main import create_app\napp = create_app()\n"
          new_smoke = "from app.production import app\n"
          if text.count(old_smoke) != 1:
              raise SystemExit(f'expected exactly one installer smoke create_app block, found {text.count(old_smoke)}')
          text = text.replace(old_smoke, new_smoke, 1)

          old_exec = 'ExecStart=${PREFIX}/.venv/bin/waitress-serve --host=\\${SG_GATEWAY_HOST} --port=\\${SG_GATEWAY_PORT} app.main:app'
          new_exec = 'ExecStart=${PREFIX}/.venv/bin/waitress-serve --host=\\${SG_GATEWAY_HOST} --port=\\${SG_GATEWAY_PORT} app.production:app'
          if text.count(old_exec) != 1:
              raise SystemExit(f'expected exactly one generated panel unit app.main target, found {text.count(old_exec)}')
          text = text.replace(old_exec, new_exec, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Add regression test
        run: |
          cat > tests/test_sg_gateway_02205_installer_production_wsgi_hotfix.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]

          def _installer() -> str:
              return (ROOT / 'install.sh').read_text(encoding='utf-8')

          def test_installer_smoke_uses_real_production_entrypoint() -> None:
              text = _installer()
              start = text.index('stage_local_application_smoke_test()')
              end = text.index('saved_https_access()', start)
              block = text[start:end]
              assert 'from app.production import app' in block
              assert 'from app.main import create_app' not in block
              assert 'app = create_app()' not in block

          def test_installer_generated_panel_unit_uses_production_entrypoint() -> None:
              text = _installer()
              start = text.index('stage_systemd_units()')
              end = text.index('stage_firewall_and_network()', start)
              block = text[start:end]
              assert 'app.production:app' in block
              assert 'app.main:app' not in block

          def test_production_entrypoint_registers_subscription_helpers() -> None:
              from app.production import app
              with app.test_request_context('/'):
                  ctx = {}
                  for processor in app.template_context_processors[None]:
                      ctx.update(processor())
              assert callable(ctx.get('sg_subscription_universal_url'))
              assert callable(ctx.get('sg_subscription_native_url'))
          PY

      - name: Remove temporary workflow and stage candidate files
        run: |
          git rm .github/workflows/tmp-02205-production-wsgi-hotfix-r1.yml
          git add install.sh tests/test_sg_gateway_02205_installer_production_wsgi_hotfix.py

      - name: Syntax and focused tests
        run: |
          bash -n install.sh
          python -m pytest -q \
            tests/test_sg_gateway_02205_installer_production_wsgi_hotfix.py \
            tests/test_sg_subscription_v1_production_02205.py \
            tests/test_sg_subscription_v1_dual_ui_02205.py

      - name: Refresh source inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          raw = subprocess.check_output(['git','ls-files','-z'])
          names = sorted(x.decode() for x in raw.split(b'\0') if x and x.decode() != 'SOURCE-SHA256SUMS')
          Path('SOURCE-SHA256SUMS').write_text(''.join(f"{hashlib.sha256(Path(n).read_bytes()).hexdigest()}  {n}\n" for n in names), encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          sha256sum -c SOURCE-SHA256SUMS >/dev/null

      - name: Full repository suite
        run: python -m pytest -q

      - name: Clean test artifacts and refresh inventory
        run: |
          rm -f data/system-activity.json
          git clean -fdX
          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          raw = subprocess.check_output(['git','ls-files','-z'])
          names = sorted(x.decode() for x in raw.split(b'\0') if x and x.decode() != 'SOURCE-SHA256SUMS')
          Path('SOURCE-SHA256SUMS').write_text(''.join(f"{hashlib.sha256(Path(n).read_bytes()).hexdigest()}  {n}\n" for n in names), encoding='utf-8')
          PY
          git add SOURCE-SHA256SUMS
          sha256sum -c SOURCE-SHA256SUMS >/dev/null

      - name: Verify public clean-install source path
        run: |
          grep -Fq 'BRANCH="${SG_GATEWAY_GITHUB_BRANCH:-${SG_GATEWAY_UPDATE_BRANCH:-dev-02205}}"' deploy/install-from-github.sh
          grep -Fq 'from app.production import app' install.sh
          grep -Fq 'app.production:app' install.sh

      - name: Verify minimal scope
        run: |
          git diff --cached --name-only 9fbf42aea2bde80a99229de5661a93b6dce4f6c1 -- | sort
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only','9fbf42aea2bde80a99229de5661a93b6dce4f6c1','--']).decode().splitlines())
          expected = {
              'install.sh',
              'SOURCE-SHA256SUMS',
              'tests/test_sg_gateway_02205_installer_production_wsgi_hotfix.py',
          }
          assert changed == expected, (changed, expected)
          PY

      - name: Finalize candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'Fix 022.05 installer production WSGI target'

      - name: Publish verified candidate
        run: git push origin HEAD:hotfix-02205-production-wsgi-r1
