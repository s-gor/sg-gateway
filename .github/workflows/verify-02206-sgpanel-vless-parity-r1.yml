name: Verify 022.06 SG-Panel VLESS parity R1

on:
  push:
    branches:
      - feat-02206-sgpanel-vless-parity-r1

permissions:
  contents: write

env:
  PYTHONPATH: .
  SG_PANEL_REFERENCE_COMMIT: 31f1e137d83c02c64bf1039ebbdaf2b02bbfbeae

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SG-Gateway
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned SG-Panel reference
        uses: actions/checkout@v4
        with:
          repository: s-gor/sg-panel
          ref: 31f1e137d83c02c64bf1039ebbdaf2b02bbfbeae
          path: sg-panel-reference
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SG-Gateway dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Prove pinned SG-Panel reference contract
        run: |
          test "$(git -C sg-panel-reference rev-parse HEAD)" = "$SG_PANEL_REFERENCE_COMMIT"
          python - <<'PY'
          from pathlib import Path

          root = Path('sg-panel-reference')
          vision = (root / 'tests/test_preview9_fix36_xray_vision_recovery.py').read_text(encoding='utf-8')
          xmux = (root / 'tests/test_preview9_fix40_xmux_visible_repair4.py').read_text(encoding='utf-8')
          service = (root / 'xpanel/service.py').read_text(encoding='utf-8')

          for value in (
              'assert xhttp["streamSettings"]["xhttpSettings"]["mode"] == "auto"',
              'assert query["mode"] == ["stream-one"]',
              'assert query["flow"] == ["xtls-rprx-vision"]',
          ):
              assert value in vision, value
          for value in (
              '"maxConnections": "2-4"',
              '"cMaxReuseTimes": "300-600"',
              '"maxConcurrency": 0',
              '"maxConnections": "6"',
              'assert "xmux" not in server',
          ):
              assert value in xmux, value
          for value in (
              '# XHTTP/gRPC TLS is terminated by Nginx. Direct Xray TLS is used by Hysteria 2.',
              '"network": "xhttp"',
              '"security": "none"',
              '"sockopt": {"trustedXForwardedFor": ["127.0.0.1"]}',
              'grpc_pass grpc://{target};',
              'f"&host={quote(server[\'address\'], safe=\'\')}"',
          ):
              assert value in service, value
          print('Pinned SG-Panel VLESS/XHTTP contract: PROVED')
          PY

      - name: Apply parity candidate
        run: python .github/scripts/run-02206-sgpanel-vless-parity-r1.py

      - name: Syntax checks
        run: |
          bash -n install.sh
          bash -n deploy/configure-panel-access.sh
          bash -n deploy/update-from-github.sh
          bash -n build-run.sh
          python -B - <<'PY'
          from pathlib import Path
          files = list(Path('app').rglob('*.py')) + list(Path('hostd').rglob('*.py')) + list(Path('tests').rglob('*.py'))
          for path in files:
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          print(f'Python syntax: {len(files)} files OK')
          PY

      - name: Remove CI scaffolding and reference checkout
        run: |
          rm -rf sg-panel-reference
          git rm .github/workflows/verify-02206-sgpanel-vless-parity-r1.yml
          git rm .github/scripts/apply-02206-sgpanel-vless-parity-r1.py
          git rm .github/scripts/run-02206-sgpanel-vless-parity-r1.py
          rm -f data/system-activity.json
          git add -A

      - name: Rebuild strict source checksum inventory
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          paths = sorted(
              p.decode('utf-8') for p in tracked
              if p and p.decode('utf-8') != 'SOURCE-SHA256SUMS'
          )
          lines = []
          for raw in paths:
              path = Path(raw)
              if not path.is_file():
                  continue
              lines.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {raw}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          print(f'SOURCE-SHA256SUMS entries={len(lines)}')
          PY
          git add SOURCE-SHA256SUMS

      - name: Commit exact candidate tree
        run: |
          git config user.name 'sg-gateway-vless-parity-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Align 022.06 VLESS XHTTP-TLS with current SG-Panel'
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Focused SG-Panel parity regressions
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_02206_sgpanel_vless_parity.py \
            tests/test_sg_gateway_02205_xmux_sgpanel_contract.py \
            tests/test_preview29_xhttp_encryption.py \
            tests/test_xray_profile_flow_v23.py \
            tests/test_preview54_sgpanel_vless_port.py \
            tests/test_sg_gateway_02206_development_identity.py \
            tests/test_sg_gateway_02206_update_channel_defaults.py

      - name: Full repository suite
        run: python -m pytest -q

      - name: Build and verify 022.06 FULL package
        run: |
          command -v zip
          command -v unzip
          OUT=/tmp/SG-Gateway-0.1.0-022.06-FULL.run
          bash build-run.sh "$OUT"
          "$OUT" --verify-only
          "$OUT" --verify-only
          test -s /tmp/SG-Gateway-0.1.0-022.06-FULL-SHA256.txt
          test -s /tmp/SG-Gateway-0.1.0-022.06-FULL-TRANSFER.zip
          unzip -t /tmp/SG-Gateway-0.1.0-022.06-FULL-TRANSFER.zip
          (cd /tmp && sha256sum -c SG-Gateway-0.1.0-022.06-FULL-SHA256.txt)

      - name: Verify exact parity scope
        run: |
          rm -f data/system-activity.json
          git status --short
          python - <<'PY'
          import subprocess

          base = '501a39b08642bb431e148026e71eabe5fa8da47b'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', f'{base}..HEAD']).decode().splitlines())
          allowed = {
              '.github/workflows/ci-02206-dev.yml',
              'BUILD-ID',
              'CHANGELOG.md',
              'SOURCE-SHA256SUMS',
              'app/clients/exports.py',
              'app/xray/sg_panel_vless.py',
              'deploy/configure-panel-access.sh',
              'deploy/update-from-github.sh',
              'hostd/sg_hostd/client_runtime.py',
              'hostd/sg_hostd/xhttp_tls_front.py',
              'install.sh',
              'release-manifest.json',
              'tests/test_sg_gateway_02205_xmux_sgpanel_contract.py',
              'tests/test_sg_gateway_02206_development_identity.py',
              'tests/test_sg_gateway_02206_sgpanel_vless_parity.py',
          }
          unexpected = changed - allowed
          required = {
              'app/clients/exports.py',
              'app/xray/sg_panel_vless.py',
              'deploy/configure-panel-access.sh',
              'deploy/update-from-github.sh',
              'hostd/sg_hostd/client_runtime.py',
              'hostd/sg_hostd/xhttp_tls_front.py',
              'tests/test_sg_gateway_02206_sgpanel_vless_parity.py',
              'SOURCE-SHA256SUMS',
          }
          assert not unexpected, sorted(unexpected)
          assert not (required - changed), sorted(required - changed)
          forbidden_prefixes = (
              'app/mihomo/', 'app/routing/', 'engines/', 'vendor/',
          )
          forbidden_exact = {
              'app/clients/amneziawg.py',
              'app/clients/amneziawg3.py',
          }
          touched = [p for p in changed if p.startswith(forbidden_prefixes) or p in forbidden_exact]
          assert not touched, touched
          print('VLESS parity diff scope: OK; AWG/Mihomo/sing-box/vendor untouched')
          PY

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: SG-Gateway-0.1.0-022.06-SGPANEL-VLESS-PARITY-R1
          path: |
            /tmp/SG-Gateway-0.1.0-022.06-FULL.run
            /tmp/SG-Gateway-0.1.0-022.06-FULL-SHA256.txt
            /tmp/SG-Gateway-0.1.0-022.06-FULL-TRANSFER.zip
          if-no-files-found: error

      - name: Push verified transport tree
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          printf 'VERIFIED_CANDIDATE_SHA=%s\n' "$candidate_sha"
          printf 'VERIFIED_CANDIDATE_TREE=%s\n' "$candidate_tree"

          git reset --soft "$GITHUB_SHA"
          git restore --source="$GITHUB_SHA" --staged --worktree \
            .github/workflows/ci-02206-dev.yml \
            .github/workflows/verify-02206-sgpanel-vless-parity-r1.yml
          rm -f data/system-activity.json
          git add -A
          git commit -m 'Stage verified SG-Panel VLESS parity payload'
          if git diff --name-only "$GITHUB_SHA..HEAD" | grep -q '^\.github/workflows/'; then
            echo 'transport commit unexpectedly changes workflow files' >&2
            exit 1
          fi
          git push --force origin HEAD:publish-02206-sgpanel-vless-parity-transport-r1
