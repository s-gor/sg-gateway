name: Verify 022.06 Full Backup verify and unlimited upload

on:
  push:
    branches:
      - fix-02206-full-backup-verify-unlimited-r1

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  full-backup-verify-unlimited:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply Full Backup product fix
        run: python .github/scripts/fix-02206-full-backup-verify-unlimited-r3.py

      - name: Check syntax before candidate commit
        run: |
          bash -n install.sh
          bash -n build-run.sh
          bash -n deploy/install-from-github.sh
          bash -n deploy/update-from-github.sh
          bash -n deploy/configure-panel-access.sh
          python -B -c "from pathlib import Path; files=list(Path('app').rglob('*.py'))+list(Path('hostd').rglob('*.py'))+list(Path('tests').rglob('*.py')); [compile(p.read_text(encoding='utf-8'), str(p), 'exec') for p in files]; print(f'syntax ok: {len(files)} files')"

      - name: Remove verification scaffolding and stage candidate
        run: |
          git rm .github/workflows/fix-02206-full-backup-verify-unlimited-r1.yml
          git rm .github/scripts/fix-02206-full-backup-verify-unlimited-r1.py
          git rm .github/scripts/fix-02206-full-backup-verify-unlimited-r2.py
          git rm .github/scripts/fix-02206-full-backup-verify-unlimited-r3.py
          rm -f data/system-activity.json
          git add -A

      - name: Rebuild strict source checksum inventory
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          paths = sorted(
              p.decode('utf-8') for p in tracked
              if p and p.decode('utf-8') != 'SOURCE-SHA256SUMS'
          )
          lines = []
          for raw in paths:
              path = Path(raw)
              if not path.is_file():
                  continue
              lines.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {raw}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          print(f'SOURCE-SHA256SUMS entries={len(lines)}')
          PY
          git add SOURCE-SHA256SUMS

      - name: Commit exact candidate tree
        run: |
          git config user.name 'sg-gateway-02206-full-backup-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Restore Full Backup verify UI and remove upload size cap'
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Focused Full Backup and updater regressions
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_02206_full_backup_verify_unlimited.py \
            tests/test_sg_gateway_02205_full_backup_verify.py \
            tests/test_sg_gateway_02205_full_backup_verify_ui.py \
            tests/test_sg_gateway_02205_full_backup_verify_mux.py \
            tests/test_sg_gateway_02205_full_backup_verify_http.py \
            tests/test_sg_gateway_02205_full_backup_verify_command.py \
            tests/test_sg_gateway_02112_install_update_split.py \
            tests/test_sg_gateway_02205_update_wsgi_isolation.py \
            tests/test_sg_gateway_02205_panel_update_state_binding.py \
            tests/test_sg_gateway_02206_development_identity.py \
            tests/test_sg_gateway_02206_ci_hygiene.py \
            tests/test_sg_gateway_02206_connections_polish.py \
            tests/test_sg_gateway_02206_update_channel_defaults.py

      - name: Full repository suite
        run: python -m pytest -q

      - name: Build and verify 022.06 FULL package
        run: |
          command -v zip
          command -v unzip
          OUT=/tmp/SG-Gateway-0.1.0-022.06-FULL.run
          bash build-run.sh "$OUT"
          "$OUT" --verify-only
          test -s /tmp/SG-Gateway-0.1.0-022.06-FULL-SHA256.txt
          test -s /tmp/SG-Gateway-0.1.0-022.06-FULL-TRANSFER.zip
          unzip -t /tmp/SG-Gateway-0.1.0-022.06-FULL-TRANSFER.zip
          (cd /tmp && sha256sum -c SG-Gateway-0.1.0-022.06-FULL-SHA256.txt)

      - name: Verify exact fix scope
        run: |
          rm -f data/system-activity.json
          git status --short
          python - <<'PY'
          import subprocess

          base = '1fdd98b9b4513f9fa035b33e12554391d458486d'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', f'{base}..HEAD']).decode().splitlines())
          allowed = {
              '.github/workflows/ci-02206-dev.yml',
              'BUILD-ID',
              'CHANGELOG.md',
              'SOURCE-SHA256SUMS',
              'app/maintenance/full_backups.py',
              'app/web/templates/maintenance.html',
              'deploy/configure-panel-access.sh',
              'deploy/update-from-github.sh',
              'hostd/sg_hostd/full_backup_runtime.py',
              'install.sh',
              'release-manifest.json',
              'tests/test_sg_gateway_02205_full_backup_verify_ui.py',
              'tests/test_sg_gateway_02206_ci_hygiene.py',
              'tests/test_sg_gateway_02206_development_identity.py',
              'tests/test_sg_gateway_02206_full_backup_verify_unlimited.py',
          }
          unexpected = changed - allowed
          required = {
              'app/maintenance/full_backups.py',
              'app/web/templates/maintenance.html',
              'deploy/configure-panel-access.sh',
              'deploy/update-from-github.sh',
              'hostd/sg_hostd/full_backup_runtime.py',
              'install.sh',
              'tests/test_sg_gateway_02206_full_backup_verify_unlimited.py',
              'SOURCE-SHA256SUMS',
          }
          assert not unexpected, sorted(unexpected)
          assert not (required - changed), sorted(required - changed)
          forbidden_prefixes = (
              'app/xray/', 'app/clients/', 'app/routing/',
              'engines/', 'vendor/'
          )
          touched_vpn = [p for p in changed if p.startswith(forbidden_prefixes)]
          assert not touched_vpn, touched_vpn
          print('Full Backup fix scope: OK; VPN dataplane untouched')
          PY

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: SG-Gateway-0.1.0-022.06-FULL-BACKUP-VERIFY-UNLIMITED-R1
          path: |
            /tmp/SG-Gateway-0.1.0-022.06-FULL.run
            /tmp/SG-Gateway-0.1.0-022.06-FULL-SHA256.txt
            /tmp/SG-Gateway-0.1.0-022.06-FULL-TRANSFER.zip
          if-no-files-found: error

      - name: Push non-workflow transport tree
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          printf 'VERIFIED_CANDIDATE_SHA=%s\n' "$candidate_sha"
          printf 'VERIFIED_CANDIDATE_TREE=%s\n' "$candidate_tree"

          git reset --soft "$GITHUB_SHA"
          git restore --source="$GITHUB_SHA" --staged --worktree \
            .github/workflows/ci-02206-dev.yml \
            .github/workflows/fix-02206-full-backup-verify-unlimited-r1.yml
          rm -f data/system-activity.json
          git add -A
          git commit -m 'Stage verified Full Backup verify/unlimited payload'

          if git diff --name-only "$GITHUB_SHA..HEAD" | grep -q '^\.github/workflows/'; then
            echo 'transport commit unexpectedly changes workflow files' >&2
            exit 1
          fi
          git push --force origin HEAD:publish-02206-full-backup-verify-unlimited-transport-r1
