name: Verify 022.05 publication package

on:
  push:
    branches:
      - fix-02205-publication-build-r1

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  publication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply publication patch
        run: python .github/scripts/fix-02205-publication-build-r1.py

      - name: Check patched shell syntax
        run: |
          bash -n build-run.sh
          bash -n build-run-vendored.sh
          bash -n install.sh
          bash -n deploy/install-from-github.sh
          bash -n deploy/update-from-github.sh

      - name: Remove CI scaffolding and stage final candidate paths
        run: |
          git rm .github/workflows/fix-02205-publication-build-r1.yml
          git rm .github/scripts/fix-02205-publication-build-r1.py
          rm -f data/system-activity.json
          git add -A

      - name: Rebuild strict source checksum inventory
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          paths = sorted(
              p.decode('utf-8') for p in tracked
              if p and p.decode('utf-8') != 'SOURCE-SHA256SUMS'
          )
          lines = []
          for raw in paths:
              path = Path(raw)
              if not path.is_file():
                  continue
              lines.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {raw}')
          Path('SOURCE-SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          print(f'SOURCE-SHA256SUMS entries={len(lines)}')
          PY
          git add SOURCE-SHA256SUMS

      - name: Commit exact candidate tree for git-archive build
        run: |
          git config user.name 'sg-gateway-publication-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Publish SG-Gateway 0.1.0-022.05 LIVE'
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Focused publication regressions
        run: |
          python -m pytest -q \
            tests/test_sg_gateway_02205_publication.py \
            tests/test_sg_gateway_02205_publication_builder.py \
            tests/test_sg_gateway_02205_installer_identity.py \
            tests/test_sg_gateway_02205_panel_update_safety.py \
            tests/test_sg_gateway_02205_panel_update_state_binding.py \
            tests/test_sg_gateway_02205_update_channel_defaults.py \
            tests/test_sg_gateway_02110_full_clean_retest.py \
            tests/test_sg_gateway_02110_systemd_transient_regression.py \
            tests/test_sg_gateway_02112_final_cumulative_cleanup_r5.py

      - name: Full repository suite
        run: python -m pytest -q

      - name: Build and verify 022.05 FULL package
        run: |
          command -v zip
          command -v unzip
          OUT=/tmp/SG-Gateway-0.1.0-022.05-FULL.run
          bash build-run.sh "$OUT"
          "$OUT" --verify-only
          test -s /tmp/SG-Gateway-0.1.0-022.05-FULL-SHA256.txt
          test -s /tmp/SG-Gateway-0.1.0-022.05-FULL-TRANSFER.zip
          unzip -t /tmp/SG-Gateway-0.1.0-022.05-FULL-TRANSFER.zip
          (cd /tmp && sha256sum -c SG-Gateway-0.1.0-022.05-FULL-SHA256.txt)

      - name: Verify final publication diff scope
        run: |
          rm -f data/system-activity.json
          git status --short
          python - <<'PY'
          import subprocess

          base = '9fbf42aea2bde80a99229de5661a93b6dce4f6c1'
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', f'{base}..HEAD']).decode().splitlines())
          allowed = {
              'BUILD-ID',
              'CHANGELOG.md',
              'PUBLICATION-02205.md',
              'README.md',
              'SOURCE-SHA256SUMS',
              '.github/workflows/ci.yml',
              'build-run.sh',
              'build-run-vendored.sh',
              'docs/INSTALLATION.md',
              'release-manifest.json',
              'tests/test_sg_gateway_02110_full_clean_retest.py',
              'tests/test_sg_gateway_02110_systemd_transient_regression.py',
              'tests/test_sg_gateway_02112_final_cumulative_cleanup_r5.py',
              'tests/test_sg_gateway_02205_publication.py',
              'tests/test_sg_gateway_02205_publication_builder.py',
          }
          unexpected = changed - allowed
          missing = {
              'BUILD-ID', '.github/workflows/ci.yml', 'build-run.sh',
              'release-manifest.json', 'tests/test_sg_gateway_02205_publication.py',
              'tests/test_sg_gateway_02205_publication_builder.py', 'SOURCE-SHA256SUMS'
          } - changed
          assert not unexpected, sorted(unexpected)
          assert not missing, sorted(missing)
          print('Publication diff scope: OK')
          PY

      - name: Upload verified 022.05 package
        uses: actions/upload-artifact@v4
        with:
          name: SG-Gateway-0.1.0-022.05-FULL
          path: |
            /tmp/SG-Gateway-0.1.0-022.05-FULL.run
            /tmp/SG-Gateway-0.1.0-022.05-FULL-SHA256.txt
            /tmp/SG-Gateway-0.1.0-022.05-FULL-TRANSFER.zip
          if-no-files-found: error

      - name: Push non-workflow transport tree
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          printf 'VERIFIED_CANDIDATE_SHA=%s\n' "$candidate_sha"
          printf 'VERIFIED_CANDIDATE_TREE=%s\n' "$candidate_tree"

          git reset --soft "$GITHUB_SHA"
          git restore --source="$GITHUB_SHA" --staged --worktree \
            .github/workflows/ci.yml \
            .github/workflows/fix-02205-publication-build-r1.yml \
            .github/scripts/fix-02205-publication-build-r1.py
          rm -f data/system-activity.json
          git add -A
          git commit -m 'Stage verified 022.05 publication payload'

          if git diff --name-only "$GITHUB_SHA..HEAD" | grep -q '^\.github/workflows/'; then
            echo 'transport commit unexpectedly changes workflow files' >&2
            exit 1
          fi
          git push --force origin HEAD:publish-02205-transport-r1
